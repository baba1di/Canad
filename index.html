<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Fofocas ✨</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdf0f3; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ff4d79; margin-bottom: 30px; }
        #mural { width: 100%; max-width: 500px; }
        
        /* Estilo do cartão da mensagem */
        .msg-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5); margin-bottom: 15px; border-left: 5px solid #ff4d79; }
        .anonym { font-weight: bold; color: #ff4d79; font-size: 0.9rem; margin-bottom: 5px; }
        .msg { color: #444; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>Fofocas do Dia 🎀</h1>
    <div id="mural"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqgPPmWG6cM3xpFLtOBjQJ8PmAVV7YgaY",
            projectId: "chatt-4bfcd",
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const mural = document.getElementById('mural');

        // Escuta as mensagens em tempo real
        onSnapshot(query(collection(db, "mensagens"), orderBy("timestamp", "desc")), (snapshot) => {
            mural.innerHTML = ""; // Limpa o mural para atualizar
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'msg-card';
                div.innerHTML = `
                    <div class="anonym">Anônimo:</div>
                    <div class="msg">${data.texto}</div>
                `;
                mural.appendChild(div);
            });
        });
    </script>
</body>
</html>
