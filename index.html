<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Social</title><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script><style>
body{margin:0;background:#05070a;color:#fff;font-family:sans-serif}
.screen{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:.3s}
.screen.active{opacity:1;pointer-events:all}

.box{background:#111;padding:20px;border-radius:15px;width:90%;max-width:400px}

input,textarea{
width:100%;
margin:5px 0;
padding:14px;
background:#222;
border:none;
color:#fff;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#00f2ff;
color:#000;
font-weight:bold;
font-size:16px;
}

.menu{
position:fixed;
top:20px;
right:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.menu button{
width:60px;
height:60px;
border-radius:15px;
font-size:20px;
}

.panel{
position:fixed;
right:-100%;
top:0;
width:100%;
height:100%;
background:#000;
transition:.3s;
padding:20px;
display:flex;
flex-direction:column;
}

.panel.open{right:0}

#msgs{
flex:1;
overflow:auto;
margin:10px 0;
}

.msg{
background:#111;
padding:12px;
border-radius:10px;
margin-bottom:8px;
}

.chat-bar{
display:flex;
gap:10px;
}

.chat-bar input{
flex:1;
}

.chat-bar button{
width:70px;
font-size:18px;
}
</style></head><body><div id="scrReg" class="screen active">
<div class="box">
<h3>Cadastro</h3>
<form id="formReg">
<input id="n" placeholder="Nome" required>
<input type="date" id="d" required>
<textarea id="b" placeholder="Bio"></textarea>
<button>Entrar</button>
</form>
</div>
</div><div id="scrApp" class="screen">
<div class="menu">
<button onclick="chat()">💬</button>
<button onclick="perfil()">👤</button>
<button onclick="config()">⚙️</button>
</div><h2 id="wlc"></h2><div id="side" class="panel">
<button onclick="fechar()">Voltar</button>
<div id="cont"></div>
</div>
</div><script>
// FIREBASE
const firebaseConfig={
apiKey:"AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
databaseURL:"https://chat-app-c974a-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let user={},ref=null;

// carregar usuário salvo
const saved=localStorage.getItem("user");
if(saved){
user=JSON.parse(saved);
start();
}

// cadastro
formReg.onsubmit=e=>{
e.preventDefault();

let birth=new Date(d.value);
let age=new Date().getFullYear()-birth.getFullYear();

if(age<10){alert("mínimo 10 anos");return;}

user={nome:n.value,bio:b.value};
localStorage.setItem("user",JSON.stringify(user));
start();
};

function start(){
scrReg.classList.remove("active");
scrApp.classList.add("active");
wlc.innerText="Olá "+user.nome;
}

// CHAT
function chat(){

if(ref) ref.off();

cont.innerHTML=`
<h2>Chat</h2>

<div id="msgs"></div>

<div class="chat-bar">
<input id="msg" placeholder="Digite..." onkeypress="enterSend(event)">
<button onclick="send()">➤</button>
</div>
`;

side.classList.add("open");

const box=document.getElementById("msgs");
box.innerHTML="";

ref=db.ref("msgs").orderByChild("time").limitToLast(100);

ref.on("child_added",snap=>{
const d=snap.val();

const div=document.createElement("div");
div.className="msg";
div.innerHTML="<b>"+d.u+"</b><br>"+d.t;

box.appendChild(div);
box.scrollTop=box.scrollHeight;
});
}

// ENTER
function enterSend(e){
if(e.key==="Enter"){
e.preventDefault();
send();
}
}

// ENVIAR
function send(){
const i=document.getElementById("msg");
if(!i) return;

const txt=i.value.trim();
if(!txt) return;

db.ref("msgs").push({
u:user.nome || "Anônimo",
t:txt,
time:Date.now()
});

i.value="";
}

// PERFIL
function perfil(){
cont.innerHTML=`
<h2>Perfil</h2>
<p><b>Nome:</b> ${user.nome}</p>
<p><b>Bio:</b> ${user.bio}</p>
`;
side.classList.add("open");
}

// CONFIG
function config(){
cont.innerHTML=`
<h2>Configurações</h2>

<p><b>Nome:</b> ${user.nome}</p>
<p><b>Bio:</b> ${user.bio}</p>

<button onclick="editar()">✏️ Editar</button>
`;
side.classList.add("open");
}

// EDITAR
function editar(){
cont.innerHTML=`
<h2>Editar Perfil</h2>

<input id="novoNome" value="${user.nome}">
<textarea id="novaBio">${user.bio}</textarea><button onclick="salvarPerfil()">Salvar</button>
`;
}

// SALVAR
function salvarPerfil(){
const nome=document.getElementById("novoNome").value;
const bio=document.getElementById("novaBio").value;

if(!nome.trim()) return alert("Nome obrigatório");

user.nome=nome;
user.bio=bio;

localStorage.setItem("user",JSON.stringify(user));
wlc.innerText="Olá "+user.nome;

config();
}

// FECHAR
function fechar(){
side.classList.remove("open");
if(ref) ref.off();
}
</script>

</body>
</html>
