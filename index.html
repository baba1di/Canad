<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real Ultra ✨</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, onSnapshot,
    query, orderBy, doc, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
    authDomain: "chat-app-c974a.firebaseapp.com",
    projectId: "chat-app-c974a",
    storageBucket: "chat-app-c974a.appspot.com",
    messagingSenderId: "753329556773",
    appId: "1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo")) || {};
let streamLocal = null;
let camAtiva = false;

window.onload = () => {
    if(user && user.nome) startApp();
    else scrReg.classList.add("active");

    formReg.onsubmit = (e) => {
        e.preventDefault();
        user = { nome: n.value, data: regData.value, genero: regGen.value, bio: regBio.value };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
};

function startApp() {
    scrReg.classList.remove("active");
    scrApp.classList.add("active");
    setDoc(doc(db, "call", "global"), { participantes: [] }, { merge: true });
}

window.abrirChat = () => {
    btnFlutuante.style.display = "none";
    sideContent.innerHTML = `
    <div class="chat-header">
        <button class="voltar-btn" onclick="fechar()">❮</button>
        <div class="header-center">Chat Real ✨</div>
        <div style="display:flex; gap:12px; align-items:center; position:relative; z-index:1001">
            <button class="icon-btn" onclick="entrarNaCall()">📞</button>
            <button class="icon-btn" onclick="abrirPerfil()">👤</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="notificacaoCall" class="call-notif"></div>
        <div id="chatMsgs"></div>
        <div id="avisoChatCall" class="aviso-chat-bottom"></div>
        <div class="chat-bar">
            <input id="msgInput" placeholder="Manda a boa...">
            <button class="send-btn" onclick="enviarMsg()">➤</button>
        </div>
    </div>
    
    <div id="telaCall" class="call-overlay">
        <div class="call-grid" id="callGrid"></div>
        <div class="controles-call">
            <button id="btnCam" class="btn-ctrl" onclick="toggleCam()">🎥</button>
            <button class="btn-ctrl btn-hangup" onclick="sairChamada()">📞</button>
        </div>
    </div>

    <div id="painelPerfil" class="perfil-overlay">
        <div class="perfil-box">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <h3 style="color:var(--main); margin:0">Editar Perfil</h3>
                <button class="voltar-btn" onclick="fecharPerfil()">✕</button>
            </div>
            <div class="avatar-grande">👤</div>
            <input id="editNome" value="${user.nome}" placeholder="Seu nome">
            <textarea id="editBio" placeholder="Sua bio">${user.bio || ''}</textarea>
            <button class="save-btn" onclick="salvarPerfil()">SALVAR ALTERAÇÕES</button>
        </div>
    </div>`;
    side.classList.add("open");
    escutarMensagens();
    escutarCall();
};

window.salvarPerfil = () => {
    user.nome = document.getElementById("editNome").value;
    user.bio = document.getElementById("editBio").value;
    localStorage.setItem("user_completo", JSON.stringify(user));
    alert("Perfil atualizado! ✨");
    fecharPerfil();
};

function escutarCall() {
    onSnapshot(doc(db, "call", "global"), (d) => {
        const p = d.data()?.participantes || [];
        const data = d.data();
        const grid = document.getElementById("callGrid");
        const avisoBottom = document.getElementById("avisoChatCall");

        if(avisoBottom) {
            if(p.length > 0) {
                avisoBottom.innerHTML = `
                <div class="aviso-bubble" onclick="entrarNaCall()">
                    <b>${p[0]} está em call!</b> Entrar (${p.length}/4)
                </div>`;
            } else { avisoBottom.innerHTML = ""; }
        }

        if(grid) {
            grid.innerHTML = "";
            grid.className = `call-grid count-${p.length}`;
            p.forEach(nome => {
                const card = document.createElement("div");
                card.className = "video-card";
                if (nome === user.nome && camAtiva) {
                    const v = document.createElement("video");
                    v.autoplay = true; v.muted = true; v.srcObject = streamLocal;
                    card.appendChild(v);
                } else {
                    card.innerHTML = `<div class="no-video"><span>${nome.charAt(0)}</span><p>${nome}</p></div>`;
                }
                grid.appendChild(card);
            });
        }
    });
}

window.toggleCam = async () => {
    const btn = document.getElementById("btnCam");
    if (!camAtiva) {
        try {
            streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            camAtiva = true;
            btn.classList.add("active-btn");
        } catch (err) { alert("Permita a câmera."); return; }
    } else {
        streamLocal.getTracks().forEach(t => t.stop());
        camAtiva = false;
        btn.classList.remove("active-btn");
    }
    await updateDoc(doc(db, "call", "global"), { [`status_${user.nome}`]: camAtiva });
};

window.entrarNaCall = async () => {
    document.getElementById("telaCall").classList.add("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayUnion(user.nome) });
};

window.sairChamada = async () => {
    if(streamLocal) streamLocal.getTracks().forEach(t => t.stop());
    camAtiva = false;
    document.getElementById("telaCall").classList.remove("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayRemove(user.nome) });
};

function escutarMensagens() {
    const box = document.getElementById("chatMsgs");
    onSnapshot(query(collection(db,"mensagens"),orderBy("createdAt", "asc")), snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const div = document.createElement("div");
            div.className = d.nome === user.nome ? "msg me" : "msg";
            let heart = d.liked ? `<span class="heart-pop">❤️</span>` : "";
            div.innerHTML = `<span class="sender">${d.nome}</span><p>${d.texto}</p>${heart}`;
            div.ondblclick = () => updateDoc(doc(db, "mensagens", docSnap.id), { liked: !d.liked });
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.enviarMsg = async () => {
    const input = document.getElementById("msgInput");
    if(!input.value.trim()) return;
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: input.value, createdAt: serverTimestamp(), liked: false });
    input.value = "";
};

window.abrirPerfil = () => {
    const p = document.getElementById("painelPerfil");
    if(p) p.style.display = "flex";
};
window.fecharPerfil = () => {
    const p = document.getElementById("painelPerfil");
    if(p) p.style.display = "none";
};
window.fechar = () => { side.classList.remove("open"); btnFlutuante.style.display = "flex"; };
</script>

<style>
:root { --main: #00f2ff; --bg: #000; }
body { margin:0; background: var(--bg); color:#fff; font-family: sans-serif; height:100vh; overflow:hidden; }

/* AVISO NO CHAT LÁ EMBAIXO */
.aviso-chat-bottom { padding: 0 15px; margin-bottom: 5px; }
.aviso-bubble { background: var(--main); color: #000; padding: 10px; border-radius: 12px; font-size: 13px; text-align: center; font-weight: bold; animation: pop 0.3s; }

.perfil-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
.perfil-box { width: 85%; background: #111; padding: 25px; border-radius: 25px; border: 1px solid var(--main); }
.avatar-grande { font-size: 50px; background: #222; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 15px auto; border: 2px solid var(--main); }
.save-btn { background: var(--main); color: #000; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 10px; }

.chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; border-bottom: 1px solid #222; }
.icon-btn { background: #222; border: none; width: 45px; height: 45px; border-radius: 50%; color: var(--main); font-size: 20px; z-index: 1002; }
.chat-wrapper { display: flex; flex-direction: column; height: calc(100% - 75px); position: relative; }
#chatMsgs { flex:1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

.msg { background: #1a1a1a; padding: 10px 15px; border-radius: 18px; max-width: 80%; align-self: flex-start; position: relative; border: 1px solid #222; }
.msg.me { background: var(--main); color: #000; align-self: flex-end; border: none; }
.heart-pop { position: absolute; bottom: -8px; right: -5px; background: #000; border-radius: 50%; padding: 2px 5px; border: 1px solid #333; font-size: 14px; }

.chat-bar { padding: 15px; background: #111; display: flex; gap: 10px; }
.chat-bar input { flex:1; background:#000; border:1px solid #333; padding:12px; border-radius:20px; color:#fff; }
.send-btn { background: var(--main); border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; }

.call-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.call-overlay.active { display: flex; }
.call-grid { display: grid; gap: 10px; width: 95%; height: 70vh; padding: 10px; }
.video-card { background: #111; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.no-video span { width: 60px; height: 60px; background: var(--main); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: bold; margin-bottom: 5px; }

.controles-call { display: flex; gap: 20px; margin-top: 20px; }
.btn-ctrl { width: 60px; height: 60px; border-radius: 50%; border: none; background: #222; color: #fff; font-size: 24px; }
.active-btn { background: var(--main) !important; color: #000 !important; }
.btn-hangup { background: #ff4444 !important; }

.screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; }
.screen.active { opacity:1; pointer-events:all; }
.panel { position: fixed; inset: 0; background: #000; transform: translateX(100%); transition: 0.3s; z-index: 500; }
.panel.open { transform: translateX(0); }
.menu button { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; background: var(--main); border: none; position: fixed; bottom: 30px; right: 25px; }
.voltar-btn { background: none; border: none; color: #fff; font-size: 20px; }
@keyframes pop { from { transform: scale(0.8); } to { transform: scale(1); } }
</style>
</head>
<body>
<div id="scrReg" class="screen"><div class="box" style="background:#111; padding:30px; border-radius:25px; border:1px solid #222; width:85%; text-align:center">
    <h2 style="color:var(--main)">Entrar ✨</h2>
    <form id="formReg">
        <input id="n" placeholder="Seu nome" required>
        <input type="date" id="regData" required>
        <select id="regGen"><option>Masculino</option><option>Feminino</option></select>
        <textarea id="regBio" placeholder="Bio"></textarea>
        <button style="background:var(--main); padding:15px; border-radius:12px; border:none; width:100%; font-weight:bold; margin-top:10px; color:#000">ENTRAR</button>
    </form>
</div></div>
<div id="scrApp" class="screen">
    <div id="btnFlutuante" class="menu"><button onclick="abrirChat()">💬</button></div>
    <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
</div>
</body>
</html>
