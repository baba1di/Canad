<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Social App</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    
    <div class="glow-container">
        <div class="ball"></div>
        <div class="ball"></div>
    </div>

    <div id="registerScreen" class="full-screen active">
        <main class="main-card glass-card">
            <div class="card-header">
                <div class="icon-box gradient-1"><i data-lucide="user-plus"></i></div>
                <h1>Crie sua Conta</h1>
                <p>Mínimo 10 anos para acessar.</p>
            </div>
            <form id="profileForm">
                <div class="grid-inputs">
                    <div class="input-wrapper"><i data-lucide="user"></i><input type="text" id="regNome" placeholder="Nome Completo" required></div>
                    <div class="input-wrapper"><i data-lucide="calendar"></i><input type="date" id="regData" required></div>
                    <div class="input-wrapper">
                        <i data-lucide="venn-diagram"></i>
                        <select id="regGenero" required>
                            <option value="" disabled selected>Gênero</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="input-wrapper"><i data-lucide="align-left"></i><textarea id="regBio" placeholder="Sua Bio..." rows="2" required></textarea></div>
                </div>
                <button type="submit" class="btn-shine">ENTRAR NO APP</button>
            </form>
        </main>
    </div>

    <div id="appScreen" class="full-screen">
        <div class="actions-bar">
            <button class="action-btn" id="openProfile"><i data-lucide="settings"></i></button>
            <button class="action-btn" id="openChat">
                <i data-lucide="message-square"></i>
                <span class="notification-badge"></span>
            </button>
        </div>
        <div class="app-content">
            <h1 class="welcome-text">Bem-vindo.</h1>
            <p>Toque nos ícones laterais.</p>
        </div>
        
        <div id="sidePanel" class="side-panel">
            <button class="close-panel" id="closePanel"><i data-lucide="arrow-left"></i> Voltar</button>
            <div id="panelContent"></div>
        </div>
    </div>

    <script type="text/template" id="profileTemplate">
        <h2>Meu Perfil</h2>
        <div class="profile-details">
            <div class="detail-item"><strong>Nome:</strong> <span id="pNome"></span></div>
            <div class="detail-item"><strong>Nascimento:</strong> <span id="pData"></span></div>
            <div class="detail-item"><strong>Gênero:</strong> <span id="pGenero"></span></div>
            <div class="bio-box"><strong>Bio:</strong><p id="pBio"></p></div>
        </div>
    </script>

    <script type="text/template" id="chatTemplate">
        <h2>Chat Global</h2>
        <div class="chat-wrapper">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Mensagem..." autocomplete="off">
                <button id="sendMsg"><i data-lucide="send"></i></button>
            </div>
        </div>
    </script>

    <script src="script.js"></script>
</body>
</html>
