<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
query, orderBy, deleteDoc, doc, getDocs, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
authDomain:"chat-app-c974a.firebaseapp.com",
projectId:"chat-app-c974a",
storageBucket:"chat-app-c974a.appspot.com",
messagingSenderId:"753329556773",
appId:"1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Recupera o usuário completo do localStorage
let user = JSON.parse(localStorage.getItem("user_completo"));
let typingTimeout = null;

window.limparTudoForce = async () => {
    if (confirm("Apagar histórico e nomes bugados?")) {
        const msgs = await getDocs(collection(db, "mensagens"));
        msgs.forEach(d => deleteDoc(doc(db, "mensagens", d.id)));
        alert("Limpo!");
    }
};

window.onload = () => {
    if(user && user.nome) startApp();
    else scrReg.classList.add("active");

    formReg.onsubmit = (e) => {
        e.preventDefault();
        
        // Verificação de idade (Mínimo 10 anos)
        const nasc = new Date(regData.value);
        const hoje = new Date();
        let idade = hoje.getFullYear() - nasc.getFullYear();
        if (hoje.getMonth() < nasc.getMonth() || (hoje.getMonth() == nasc.getMonth() && hoje.getDate() < nasc.getDate())) idade--;

        if(idade < 10) {
            alert("Você precisa ter mais de 10 anos para entrar!");
            return;
        }

        user = { 
            nome: n.value,
            genero: regGen.value,
            bio: regBio.value
        };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
};

function startApp() {
    scrReg.classList.remove("active");
    scrApp.classList.add("active");
}

window.abrirChat = () => {
    btnFlutuante.style.display = "none";
    sideContent.innerHTML = `
    <div class="chat-wrapper">
        <div id="chatMsgs"></div>
        <div id="statusTyping"></div>
        <div class="chat-bar">
            <input id="msgInput" placeholder="Manda a boa..." oninput="handleTyping()">
            <button onclick="enviarMsg()">➤</button>
        </div>
    </div>
    <div id="modalApagar" class="modal-msg">
        <div class="modal-content">
            <p id="txtModal"></p>
            <button id="btnAcao" class="btn-danger"></button>
            <button onclick="fecharModal()" style="background:#333; color:#fff">Cancelar</button>
        </div>
    </div>`;
    side.classList.add("open");
    
    const box = document.getElementById("chatMsgs");
    const input = document.getElementById("msgInput");
    input.addEventListener("keypress", (e) => { if(e.key === 'Enter') enviarMsg(); });

    onSnapshot(query(collection(db,"mensagens"),orderBy("createdAt", "asc")), snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const id = docSnap.id;
            const div = document.createElement("div");
            div.className = d.nome === user.nome ? "msg me" : "msg";
            div.innerHTML = `<b>${d.nome}</b><p>${d.texto}</p>`;
            
            // Lógica de Segurar para Apagar
            let timer;
            const start = () => timer = setTimeout(() => abrirOpcoes(id, d.nome), 700);
            const stop = () => clearTimeout(timer);
            
            div.ontouchstart = start; div.ontouchend = stop;
            div.onmousedown = start; div.onmouseup = stop;
            
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });

    onSnapshot(collection(db, "typing"), snap => {
        const typingList = [];
        snap.forEach(d => { if(d.id !== user.nome && d.data().isTyping) typingList.push(d.id); });
        const status = document.getElementById("statusTyping");
        if(typingList.length === 1) status.innerText = `${typingList[0]} está digitando...`;
        else if(typingList.length === 2) status.innerText = `${typingList[0]} e ${typingList[1]} estão digitando...`;
        else if(typingList.length >= 3) status.innerText = `Várias pessoas digitando...`;
        else status.innerText = "";
    });
};

window.abrirOpcoes = (id, dono) => {
    const modal = document.getElementById("modalApagar");
    const txt = document.getElementById("txtModal");
    const btn = document.getElementById("btnAcao");
    modal.classList.add("active");

    if(dono === user.nome) {
        txt.innerText = "Apagar mensagem para todos?";
        btn.innerText = "Apagar para todos";
        btn.onclick = () => { deleteDoc(doc(db, "mensagens", id)); fecharModal(); };
    } else {
        txt.innerText = "Remover mensagem apenas para mim?";
        btn.innerText = "Remover para mim";
        btn.onclick = () => { fecharModal(); /* Lógica visual de remover localmente se desejar */ };
    }
};

window.fecharModal = () => document.getElementById("modalApagar").classList.remove("active");

window.handleTyping = () => {
    setDoc(doc(db, "typing", user.nome), { isTyping: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { setDoc(doc(db, "typing", user.nome), { isTyping: false }); }, 2000);
};

window.enviarMsg = async () => {
    const txt = msgInput.value.trim();
    if(!txt) return;
    setDoc(doc(db, "typing", user.nome), { isTyping: false });
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: txt, createdAt: serverTimestamp() });
    msgInput.value = "";
};

window.fechar = () => {
    side.classList.remove("open");
    btnFlutuante.style.display = "flex";
};
</script>
<style>
body{ margin:0; background:#000; color:#fff; font-family: sans-serif; height:100vh; overflow:hidden; }
.screen{ position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; }
.screen.active{ opacity:1; pointer-events:all; }
.box{ background:#111; padding:20px; border-radius:15px; width:85%; border:1px solid #222; text-align:center; max-height: 90vh; overflow-y: auto; }
input, select, textarea { width:100%; padding:15px; margin:5px 0; background:#1a1a1a; border:1px solid #333; border-radius:10px; color:#fff; box-sizing: border-box; }

.menu{ position:fixed; bottom:25px; right:20px; z-index:10; }
.menu button{ width:65px; height:65px; border-radius:50%; font-size:28px; background:#00f2ff; border:none; box-shadow: 0 0 15px #00f2ff66; cursor:pointer; }

.panel{ position:fixed; inset:0; background:#000; transform:translateX(100%); transition:.3s; display:flex; flex-direction:column; z-index: 100; }
.panel.open{ transform:translateX(0); }

.chat-wrapper { display: flex; flex-direction: column; height: 100%; }

/* Scroll livre e mensagens fixadas embaixo */
#chatMsgs{ flex:1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }

#statusTyping { padding: 0 20px; font-size: 12px; color: #00f2ff; height: 20px; font-style: italic; }

.msg{ background:#1a1d23; padding:10px 14px; border-radius:18px 18px 18px 4px; max-width:80%; align-self:flex-start; border: 1px solid #222; }
.msg.me{ background:#00f2ff; color:#000; align-self:flex-end; border-radius:18px 18px 4px 18px; border:none; }
.msg b{ font-size:11px; display:block; opacity:0.8; }
.msg p{ margin:5px 0 0 0; font-size:16px; word-wrap: break-word; }

.chat-bar{ padding:15px; background:#111; display:flex; gap:10px; }
.chat-bar input{ margin:0; border-radius:25px; background:#000; flex:1; padding-left:20px; }
.chat-bar button{ width:55px; border-radius:50%; background:#00f2ff; border:none; color:#000; font-weight:bold; cursor:pointer; }

/* MODAL DE APAGAR */
.modal-msg{ position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:1000; }
.modal-msg.active{ display:flex; }
.modal-content{ background:#111; padding:20px; border-radius:15px; width:80%; border:1px solid #333; }
.modal-content button { width:100%; padding:12px; margin-top:10px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; }
.btn-danger { background:#ff4444; color:#fff; }

.voltar{ padding:15px; color:#00f2ff; background:none; border:none; font-size:18px; text-align:left; cursor:pointer; }
</style>
</head>
<body>
<div id="scrReg" class="screen"><div class="box">
<h2>Cadastro</h2>
<form id="formReg">
    <input id="n" placeholder="Seu nome" required>
    <input type="date" id="regData" required title="Data de Nascimento">
    <select id="regGen"><option>Masculino</option><option>Feminino</option><option>Outro</option></select>
    <textarea id="regBio" placeholder="Sua Bio (opcional)"></textarea>
    <button style="background:#00f2ff; padding:12px; border-radius:8px; border:none; width:100%; font-weight:bold; margin-top:10px">ENTRAR</button>
</form>
<button onclick="limparTudoForce()" style="background:none; color:#ff4444; border:none; margin-top:20px; font-size:10px; cursor:pointer">LIMPAR BUG DE MENSAGENS</button>
</div></div>

<div id="scrApp" class="screen">
<div class="menu" id="btnFlutuante"><button onclick="abrirChat()">💬</button></div>
<div id="side" class="panel">
<button class="voltar" onclick="fechar()">❮ Voltar</button>
<div id="sideContent" style="flex:1; display:flex; flex-direction:column; overflow:hidden;"></div>
</div>
</div>
</body>
</html>
