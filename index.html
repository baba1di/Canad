<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat App</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
query, orderBy, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
authDomain:"chat-app-c974a.firebaseapp.com",
projectId:"chat-app-c974a",
storageBucket:"chat-app-c974a.appspot.com",
messagingSenderId:"753329556773",
appId:"1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user"));
let unsubscribe = null;

function idade(data){
let d = new Date(data);
return new Date().getFullYear() - d.getFullYear();
}

window.onload = ()=>{
if(user && user.nome){
startApp();
}else{
scrReg.classList.add("active");
}

formReg.onsubmit = (e)=>{
e.preventDefault();
user = {
nome: n.value,
data: d.value,
genero: g.value,
bio: b.value
};
localStorage.setItem("user", JSON.stringify(user));
startApp();
};
};

function startApp(){
scrReg.classList.remove("active");
scrApp.classList.add("active");
wlc.innerText = "Olá, " + user.nome;
}

window.abrirChat = ()=>{
sideContent.innerHTML = `
<div class="chat-container">
    <div class="chat-header">
        <h2>Mensagens</h2>
    </div>
    <div id="chatMsgs"></div>
    <div class="chat-bar">
        <input id="msgInput" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">➤</button>
    </div>
</div>
`;

side.classList.add("open");
const box = document.getElementById("chatMsgs");

if(unsubscribe) unsubscribe();

unsubscribe = onSnapshot(
query(collection(db,"mensagens"),orderBy("createdAt")),
snap=>{
box.innerHTML="";
snap.forEach(docSnap=>{
const d = docSnap.data();
const id = docSnap.id;
const div = document.createElement("div");
div.className = d.nome === user.nome ? "msg me" : "msg";
div.innerHTML = `<b>${d.nome}</b><p>${d.texto}</p>`;

div.oncontextmenu = (e)=>{
e.preventDefault();
if(d.nome === user.nome){
if(confirm("Apagar pra todos?")){
deleteDoc(doc(db,"mensagens",id));
}
}
};
box.appendChild(div);
});

// Scroll automático para a última mensagem ao carregar
box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
});
};

window.enviarMsg = async ()=>{
const txt = msgInput.value.trim();
if(!txt) return;
await addDoc(collection(db,"mensagens"),{
nome:user.nome,
texto:txt,
createdAt: Date.now()
});
msgInput.value="";
};

window.abrirPerfil = ()=>{
sideContent.innerHTML = `
<div style="padding:20px">
<h2>Meu Perfil</h2>
<div class="msg" style="background:#1a1d23">
<p><b>Nome:</b> ${user.nome}</p>
<p><b>Idade:</b> ${idade(user.data)} anos</p>
<p><b>Gênero:</b> ${user.genero}</p>
<p><b>Bio:</b> ${user.bio}</p>
</div>
</div>
`;
side.classList.add("open");
};

window.fechar = ()=>{
side.classList.remove("open");
if(unsubscribe) unsubscribe();
};
</script>
<style>
body{
margin:0;
background:#05070a;
color:#fff;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
height:100vh;
overflow:hidden;
}

/* Telas */
.screen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition: 0.3s;
}
.screen.active{ opacity:1; pointer-events:all; }

.box{ background:#111; padding:25px; border-radius:20px; width:85%; max-width:400px; border: 1px solid #222; }

input, textarea, select{
width:100%; padding:14px; margin:8px 0; background:#1a1d23;
border:1px solid #333; border-radius:12px; color:#fff; box-sizing: border-box;
}

button{
width:100%; padding:15px; background:#00f2ff; border:none;
border-radius:12px; margin-top:10px; font-weight:bold; cursor:pointer;
}

/* Menu Principal */
.menu{ position:fixed; bottom:30px; right:20px; display:flex; flex-direction:column; gap:15px; }
.menu button{ width:65px; height:65px; border-radius:50%; font-size:24px; box-shadow: 0 4px 15px rgba(0,242,255,0.3); }

/* Painel Lateral (Chat/Perfil) */
.panel{
position:fixed; right:-100%; top:0; width:100%; height:100%;
background:#05070a; transition:.4s cubic-bezier(0.4, 0, 0.2, 1);
display:flex; flex-direction:column; z-index: 100;
}
.panel.open{ right:0; }

.btn-voltar {
padding: 15px; background: transparent; color: #00f2ff;
text-align: left; border: none; width: fit-content; font-size: 16px;
}

/* CHAT - EFEITO DE ARRASTAR (Scroll) */
.chat-container {
display: flex; flex-direction: column; height: 100%;
}

.chat-header { padding: 10px 20px; border-bottom: 1px solid #111; }

#chatMsgs{
flex:1;
overflow-y: scroll; /* Permite rolar */
overflow-x: hidden;
padding: 20px;
display: flex;
flex-direction: column;
gap: 10px;
-webkit-overflow-scrolling: touch; /* Rolagem lisa no iPhone/Android */
scrollbar-width: none; /* Esconde barra no Firefox */
}

#chatMsgs::-webkit-scrollbar { display: none; } /* Esconde barra no Chrome/Safari */

.msg{
background:#1a1d23; padding:12px 16px; border-radius:18px 18px 18px 4px;
max-width: 80%; width: fit-content; align-self: flex-start;
word-wrap: break-word;
}

.msg.me {
background: #00f2ff; color: #000;
align-self: flex-end; border-radius: 18px 18px 4px 18px;
}

.msg b{ font-size:11px; opacity: 0.7; display:block; margin-bottom: 4px; }
.msg.me b { color: #00555a; }
.msg p { margin: 0; line-height: 1.4; }

/* Barra de Mensagem Fixa */
.chat-bar{
padding: 15px; background:#05070a;
display:flex; gap:10px; border-top:1px solid #111;
}
.chat-bar input{ margin: 0; background: #111; border-radius: 25px; padding-left: 20px; }
.chat-bar button{ width: 55px; margin: 0; border-radius: 50%; }

</style>
</head>
<body>

<div id="scrReg" class="screen">
<div class="box">
<h3 style="margin-top:0">Criar Conta</h3>
<form id="formReg">
<input id="n" placeholder="Seu nome" required>
<input type="date" id="d" required title="Data de Nascimento">
<select id="g">
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
</select>
<textarea id="b" placeholder="Conte um pouco sobre você..." rows="3"></textarea>
<button type="submit">Começar</button>
</form>
</div>
</div>

<div id="scrApp" class="screen">
<div class="menu">
<button onclick="abrirPerfil()">👤</button>
<button onclick="abrirChat()">💬</button>
</div>
<h2 id="wlc" style="text-align:center; position: absolute; top: 40%;"></h2>

<div id="side" class="panel">
<button class="btn-voltar" onclick="fechar()">❮ Voltar</button>
<div id="sideContent" style="flex:1; display:flex; flex-direction:column; overflow:hidden;"></div>
</div>
</div>

</body>
</html>
