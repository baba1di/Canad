<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real Premium Ultra ✨</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, onSnapshot,
    query, orderBy, doc, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc, deleteField
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
    authDomain: "chat-app-c974a.firebaseapp.com",
    projectId: "chat-app-c974a",
    storageBucket: "chat-app-c974a.appspot.com",
    messagingSenderId: "753329556773",
    appId: "1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo")) || {};
let streamLocal = null;
let screenStream = null;
let meuPeer = null;
let mediaRecorder;
let audioChunks = [];
let gravando = false;
let msgSelecionadaId = null;
let msgSelecionadaNome = null;
let listaUsuarios = [];
let msgsApagadasLocal = JSON.parse(localStorage.getItem("msgs_ocultas")) || [];
let respondendoA = null;

window.onload = () => {
    if(user && user.nome) {
        startApp();
    } else {
        scrReg.classList.add("active");
    }

    formReg.onsubmit = (e) => {
        e.preventDefault();
        user = { nome: n.value, data: regData.value, genero: regGen.value, bio: regBio.value };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
    
    document.addEventListener("click", (e) => {
        if (!e.target.closest('.menu-msg-box')) fecharMenuMsg();
        if (!e.target.closest('.at-box')) fecharAtList();
    });
};

async function startApp() {
    scrReg.classList.remove("active");
    scrApp.classList.add("active");
    const peerId = user.nome.replace(/\s+/g, '_').toLowerCase();
    meuPeer = new Peer(peerId); 

    meuPeer.on('call', (call) => {
        const streamParaEnviar = screenStream || streamLocal;
        if(streamParaEnviar) {
            call.answer(streamParaEnviar);
            call.on('stream', (remoteStream) => { addVideoRemoto(call.peer, remoteStream); });
        } else {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then((stream) => {
                call.answer(stream);
                call.on('stream', (remoteStream) => { addVideoRemoto(call.peer, remoteStream); });
            }).catch(err => console.error("Erro ao atender:", err));
        }
    });

    await setDoc(doc(db, "usuarios_online", user.nome), { nome: user.nome, lastSeen: serverTimestamp(), digitando: false });
    onSnapshot(collection(db, "usuarios_online"), snap => {
        listaUsuarios = [];
        let digitando = [];
        snap.forEach(d => {
            const data = d.data();
            listaUsuarios.push(data.nome);
            if(data.digitando && data.nome !== user.nome) digitando.push(data.nome);
        });
        atualizarDigitando(digitando);
    });

    setDoc(doc(db, "call", "global"), { participantes: [] }, { merge: true });
}

function atualizarDigitando(lista) {
    const el = document.getElementById("statusDigitando");
    if(!el) return;
    if(lista.length === 0) el.innerText = "";
    else if(lista.length === 1) el.innerText = `${lista[0]} está digitando...`;
    else if(lista.length === 2) el.innerText = `${lista[0]} e ${lista[1]} estão digitando...`;
    else el.innerText = "Várias pessoas digitando...";
}

window.abrirChat = () => {
    btnFlutuante.style.display = "none";
    sideContent.innerHTML = `
    <div id="notificacaoChat" class="notificacao-top">Nova mensagem! 📥</div>
    <div class="chat-header">
        <button class="voltar-btn" onclick="fechar()">❮</button>
        <div class="header-center">Chat Real ✨</div>
        <div style="display:flex; gap:12px; align-items:center; z-index:1001">
            <button class="icon-btn" onclick="entrarNaCall()">📞</button>
            <button class="icon-btn" onclick="abrirPerfil()">👤</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="chatMsgs"></div>
        <div id="statusDigitando" class="status-digitando"></div>
        <div id="atList" class="at-box"></div>
        <div id="replyPreview" class="reply-preview"></div>
        <div id="avisoChatCall" class="aviso-chat-bottom"></div>
        <div class="chat-bar">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="enviarFoto(this)">
            <button class="gallery-btn" onclick="document.getElementById('fileInput').click()">👄+</button>
            <button id="btnAudio" class="audio-btn">🎙️</button>
            <input id="msgInput" placeholder="Manda a boa..." oninput="aoDigitar(this)">
            <button class="send-btn" onclick="enviarMsg()">➤</button>
        </div>
    </div>
    <div id="fullView" class="full-image-overlay" onclick="fecharFoto()">
        <img id="imgExpandida">
        <button class="save-photo-btn" onclick="event.stopPropagation(); baixarFoto()">💾 Salvar na Galeria</button>
    </div>
    <div id="btnRetornarCall" class="btn-retornar-call" onclick="maximizarCall()">Chamada em curso... 📞</div>
    <div id="menuMsg" class="menu-msg-overlay">
        <div class="menu-msg-box"><button class="btn-apagar" onclick="confirmarApagar()">🗑️ Apagar Mensagem</button></div>
    </div>
    <div id="telaCall" class="call-overlay">
        <div class="call-grid" id="callGrid"></div>
        <div class="controles-call">
            <button id="btnCam" class="btn-ctrl" onclick="toggleCam()">🎥</button>
            <button id="btnScreen" class="btn-ctrl" onclick="toggleShareScreen()">🖥️</button>
            <button class="btn-ctrl" onclick="minimizarCall()">📉</button>
            <button class="btn-ctrl btn-hangup" onclick="sairChamada()">📞</button>
        </div>
    </div>
    <div id="painelPerfil" class="perfil-overlay">
        <div class="perfil-box">
            <button class="voltar-btn" style="float:right" onclick="fecharPerfil()">✕</button>
            <h3 style="color:var(--main)">Meu Perfil</h3>
            <div class="avatar-grande">👤</div>
            <input id="editNome" value="${user.nome}">
            <textarea id="editBio">${user.bio || ''}</textarea>
            <button class="save-btn" onclick="salvarPerfil()">SALVAR ALTERAÇÕES</button>
        </div>
    </div>`;
    side.classList.add("open");
    escutarMensagens();
    escutarCall();
    configurarGravador();
};

let clickTimer = null; 

function escutarMensagens() {
    const box = document.getElementById("chatMsgs");
    let primeiraCarga = true;
    
    onSnapshot(query(collection(db,"mensagens"),orderBy("createdAt", "asc")), snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            if(msgsApagadasLocal.includes(docSnap.id)) return;
            const d = docSnap.data();
            const mencao = d.texto?.match(/@(\S+)/);
            const destino = mencao ? mencao[1] : null;
            const ehPrivada = destino !== null;
            const paraMim = destino === user.nome;
            const euMandei = d.nome === user.nome;
            
            if (!ehPrivada || euMandei || paraMim) {
                const div = document.createElement("div");
                div.className = euMandei ? "msg me" : "msg";
                if (ehPrivada) div.classList.add("private-msg");
                div.id = `msg_${docSnap.id}`;
                
                let replyHtml = d.replyTo ? `<div class="reply-inside"><b>${d.replyTo.nome}:</b> ${d.replyTo.texto}</div>` : "";
                let heart = d.liked ? `<span class="heart-pop">❤️</span>` : "";
                let tagPrivado = ehPrivada ? `<span class="lock-icon">🔒 Privado</span>` : "";
                
                let content = "";
                if(d.foto) {
                    content = `<img src="${d.foto}" class="img-mini" onclick="expandirFoto('${d.foto}')">`;
                } else if(d.audio) {
                    content = `<audio controls src="${d.audio}"></audio>`;
                } else {
                    content = `<p>${d.texto || ""}</p>`;
                }

                div.innerHTML = `${replyHtml}<span class="sender">${d.nome} ${tagPrivado}</span>${content}${heart}`;
                
                div.onclick = (e) => {
                    if (clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                    } else {
                        clickTimer = setTimeout(() => {
                            prepararResposta(d.nome, d.texto || (d.foto ? "Foto" : "Áudio"));
                            clickTimer = null;
                        }, 250); 
                    }
                };

                div.ondblclick = (e) => { 
                    e.stopPropagation();
                    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
                    updateDoc(doc(db, "mensagens", docSnap.id), { liked: !d.liked }); 
                };

                let timer;
                const startTimer = () => { timer = setTimeout(() => abrirMenuMsg(docSnap.id, d.nome), 600); };
                const endTimer = () => { clearTimeout(timer); };
                div.addEventListener("pointerdown", startTimer);
                div.addEventListener("pointerup", endTimer);
                div.addEventListener("pointerleave", endTimer);
                box.appendChild(div);
            }
        });
        if(!primeiraCarga) mostrarNotificacao();
        primeiraCarga = false;
        box.scrollTop = box.scrollHeight;
    });
}

window.toggleShareScreen = async () => {
    const btn = document.getElementById("btnScreen");
    if (!screenStream) {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            btn.classList.add("active-btn");
            
            const meuVid = document.querySelector(`#card_${meuPeer.id} video`);
            if(meuVid) meuVid.srcObject = screenStream;

            // Transmite a troca de track para todos os conectados
            for (let conId in meuPeer.connections) {
                meuPeer.connections[conId].forEach(conn => {
                    if (conn.peerConnection) {
                        const sender = conn.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (sender) sender.replaceTrack(screenStream.getVideoTracks()[0]);
                    }
                });
            }

            screenStream.getVideoTracks()[0].onended = () => toggleShareScreen();
        } catch (e) { console.error(e); }
    } else {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
        btn.classList.remove("active-btn");
        
        for (let conId in meuPeer.connections) {
            meuPeer.connections[conId].forEach(conn => {
                if (conn.peerConnection) {
                    const sender = conn.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(streamLocal.getVideoTracks()[0]);
                }
            });
        }
        addVideoRemoto(meuPeer.id, streamLocal);
    }
};

window.entrarNaCall = async () => {
    document.getElementById("telaCall").classList.add("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayUnion(user.nome) });
    try {
        streamLocal = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        addVideoRemoto(meuPeer.id, streamLocal);
        const snap = await getDocs(collection(db, "call"));
        const p = snap.docs[0].data().participantes || [];
        p.forEach(pessoa => {
            if(pessoa !== user.nome) {
                const id = pessoa.replace(/\s+/g, '_').toLowerCase();
                const call = meuPeer.call(id, streamLocal);
                call.on('stream', (rs) => addVideoRemoto(id, rs));
            }
        });
    } catch (e) { alert("Erro na câmera!"); }
};

window.addVideoRemoto = (peerId, stream) => {
    const grid = document.getElementById("callGrid");
    let card = document.getElementById(`card_${peerId}`);
    if (!card) {
        card = document.createElement("div");
        card.className = "video-card";
        card.id = `card_${peerId}`;
        grid.appendChild(card);
    }
    card.innerHTML = ""; 
    const v = document.createElement("video");
    v.autoplay = true; v.playsinline = true;
    if(peerId === meuPeer.id) { v.muted = true; v.style.transform = "scaleX(-1)"; }
    v.srcObject = stream;
    card.appendChild(v);
};

window.sairChamada = async () => { if(streamLocal) streamLocal.getTracks().forEach(t => t.stop()); if(screenStream) screenStream.getTracks().forEach(t => t.stop()); await updateDoc(doc(db, "call", "global"), { participantes: arrayRemove(user.nome) }); location.reload(); };
window.minimizarCall = () => { document.getElementById("telaCall").classList.remove("active"); document.getElementById("btnRetornarCall").style.display = "block"; };
window.maximizarCall = () => { document.getElementById("telaCall").classList.add("active"); document.getElementById("btnRetornarCall").style.display = "none"; };
function escutarCall() { onSnapshot(doc(db, "call", "global"), (d) => { const p = d.data()?.participantes || []; const aviso = document.getElementById("avisoChatCall"); if(aviso && p.length > 0) { aviso.innerHTML = `<div class="aviso-bubble" onclick="entrarNaCall()"><b>${p[0]} está em call!</b> Entrar (${p.length}/4)</div>`; } else if(aviso) { aviso.innerHTML = ""; } }); }
window.abrirMenuMsg = (id, nome) => { msgSelecionadaId = id; msgSelecionadaNome = nome; document.getElementById("menuMsg").style.display = "flex"; };
window.fecharMenuMsg = () => { document.getElementById("menuMsg").style.display = "none"; };
window.confirmarApagar = async () => { if (msgSelecionadaNome === user.nome) { await deleteDoc(doc(db, "mensagens", msgSelecionadaId)); } else { msgsApagadasLocal.push(msgSelecionadaId); localStorage.setItem("msgs_ocultas", JSON.stringify(msgsApagadasLocal)); escutarMensagens(); } fecharMenuMsg(); };
window.salvarPerfil = () => { user.nome = editNome.value; user.bio = editBio.value; localStorage.setItem("user_completo", JSON.stringify(user)); alert("Salvo! ✨"); fecharPerfil(); };
window.abrirPerfil = () => painelPerfil.style.display = "flex";
window.fecharPerfil = () => painelPerfil.style.display = "none";
window.fechar = () => { side.classList.remove("open"); btnFlutuante.style.display = "flex"; };
function mostrarNotificacao() { const note = document.getElementById("notificacaoChat"); if(note) { note.classList.add("show"); setTimeout(() => note.classList.remove("show"), 3000); } }
let typingTimer;
window.aoDigitar = (input) => { checarAt(input); updateDoc(doc(db, "usuarios_online", user.nome), { digitando: true }); clearTimeout(typingTimer); typingTimer = setTimeout(() => { updateDoc(doc(db, "usuarios_online", user.nome), { digitando: false }); }, 2000); };
window.checarAt = (input) => { const box = document.getElementById("atList"); const lastWord = input.value.split(" ").pop(); if (lastWord.startsWith("@")) { const busca = lastWord.slice(1).toLowerCase(); const filtrados = listaUsuarios.filter(u => u.toLowerCase().includes(busca) && u !== user.nome); if (filtrados.length > 0) { box.innerHTML = filtrados.map(u => `<div onclick="selecionarAt('${u}')">@${u}</div>`).join(""); box.style.display = "block"; } else { fecharAtList(); } } else { fecharAtList(); } };
window.selecionarAt = (nome) => { const input = document.getElementById("msgInput"); const palavras = input.value.split(" "); palavras.pop(); input.value = palavras.join(" ") + " @" + nome + " "; fecharAtList(); input.focus(); };
window.fecharAtList = () => { const box = document.getElementById("atList"); if(box) box.style.display = "none"; };
window.enviarFoto = (input) => {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64Image = e.target.result;
            if(base64Image) {
               await addDoc(collection(db, "mensagens"), {
                   nome: user.nome, foto: base64Image, replyTo: respondendoA, createdAt: serverTimestamp(), liked: false
               });
               cancelarResposta();
            }
            input.value = ""; 
        };
        reader.readAsDataURL(file);
    }
};
window.enviarMsg = async () => {
    const input = document.getElementById("msgInput");
    if(!input.value.trim()) return;
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: input.value, replyTo: respondendoA, createdAt: serverTimestamp(), liked: false });
    input.value = "";
    cancelarResposta();
    updateDoc(doc(db, "usuarios_online", user.nome), { digitando: false });
};
</script>

#chatMsgs { scroll-behavior: smooth; }
button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="scrReg" class="screen"><div class="box" style="background:#111; padding:30px; border-radius:25px; border:1px solid #222; width:85%; text-align:center">
    <h2 style="color:var(--main)">Entrar ✨</h2>
    <form id="formReg">
        <input id="n" placeholder="Seu nome" required>
        <input type="date" id="regData" required>
        <select id="regGen"><option>Masculino</option><option>Feminino</option></select>
        <textarea id="regBio" placeholder="Sua bio"></textarea>
        <button style="background:var(--main); padding:15px; border-radius:12px; border:none; width:100%; font-weight:bold; margin-top:10px; color:#000">ENTRAR</button>
    </form>
</div></div>
<div id="scrApp" class="screen">
    <div id="btnFlutuante" class="menu"><button onclick="abrirChat()">💬</button></div>
    <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
</div>

<script>
    async function atualizarStatusOnline() {
        if (user.nome) {
            await setDoc(doc(db, "usuarios_online", user.nome), {
                nome: user.nome,
                lastSeen: serverTimestamp()
            }, {merge: true});
        }
    }
    setInterval(atualizarStatusOnline, 60000);
</script>
</body>
</html>
