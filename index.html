<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real Premium ✨</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, onSnapshot,
    query, orderBy, deleteDoc, doc, getDocs, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
    authDomain: "chat-app-c974a.firebaseapp.com",
    projectId: "chat-app-c974a",
    storageBucket: "chat-app-c974a.appspot.com",
    messagingSenderId: "753329556773",
    appId: "1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo"));
let streamLocal = null;
let camAtiva = false;
let micAtivo = true;

window.onload = () => {
    if(user && user.nome) startApp();
    else scrReg.classList.add("active");

    formReg.onsubmit = (e) => {
        e.preventDefault();
        user = { nome: n.value, data: regData.value, genero: regGen.value, bio: regBio.value };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
};

function startApp() {
    scrReg.classList.remove("active");
    scrApp.classList.add("active");
    setDoc(doc(db, "call", "global"), { participantes: [] }, { merge: true });
}

window.abrirChat = () => {
    btnFlutuante.style.display = "none";
    sideContent.innerHTML = `
    <div class="chat-header">
        <button class="voltar-btn" onclick="fechar()">❮</button>
        <div class="header-center">Chat Real ✨</div>
        <div style="display:flex; gap:12px; align-items:center">
            <button class="icon-btn" onclick="iniciarChamada()">📞</button>
            <button class="icon-btn" onclick="abrirPerfil()">👤</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="notificacaoCall" class="call-notif"></div>
        <div id="chatMsgs"></div>
        <div class="chat-bar">
            <input id="msgInput" placeholder="Manda a boa...">
            <button class="send-btn" onclick="enviarMsg()">➤</button>
        </div>
    </div>
    
    <div id="telaCall" class="call-overlay">
        <div class="call-grid" id="callGrid"></div>
        <div class="controles-call">
            <button id="btnCam" class="btn-ctrl" onclick="toggleCam()">🎥</button>
            <button id="btnMic" class="btn-ctrl" onclick="toggleMic()">🎤</button>
            <button class="btn-ctrl btn-hangup" onclick="sairChamada()">📞</button>
        </div>
    </div>

    <div id="painelPerfil" class="perfil-overlay">
        <div class="perfil-box">
            <button class="voltar-btn" onclick="fecharPerfil()">✕</button>
            <div class="avatar-grande">👤</div>
            <div class="p-item"><span>NOME</span> <b>${user.nome}</b></div>
            <div class="p-item"><span>BIO</span> <b>${user.bio || 'Sem bio'}</b></div>
        </div>
    </div>`;
    side.classList.add("open");
    escutarMensagens();
    escutarCall();
};

window.iniciarChamada = async () => {
    await addDoc(collection(db, "mensagens"), {
        nome: user.nome,
        texto: "abriu uma call agora! 📞",
        tipo: "call_invite",
        createdAt: serverTimestamp()
    });
    entrarNaCall();
};

function escutarCall() {
    onSnapshot(doc(db, "call", "global"), (d) => {
        const p = d.data()?.participantes || [];
        const data = d.data();
        const grid = document.getElementById("callGrid");
        const notif = document.getElementById("notificacaoCall");

        // Painelzinho que aparece no topo quando tem gente na call
        if(notif && p.length > 0) {
            const nomes = p.join(", ");
            notif.innerHTML = `
                <div class="notif-content">
                    <span><b>${p[0]}</b> está em call (${p.length}/4)</span>
                    <button onclick="entrarNaCall()">ENTRAR</button>
                </div>
            `;
            notif.classList.add("show");
            
            // Lógica dos 4 segundos para "esconder" mas deixar o botão se quiser
            setTimeout(() => { 
                if(notif) notif.style.opacity = "0.7"; 
            }, 4000);
        } else if(notif) {
            notif.classList.remove("show");
        }

        if(grid) {
            grid.innerHTML = "";
            grid.className = `call-grid count-${p.length}`;
            p.forEach(nome => {
                const isCamOn = data[`status_${nome}`];
                const card = document.createElement("div");
                card.className = "video-card";
                
                if (nome === user.nome && camAtiva) {
                    const v = document.createElement("video");
                    v.autoplay = true; v.muted = true; v.srcObject = streamLocal;
                    card.appendChild(v);
                } else if (isCamOn) {
                    card.innerHTML = `<div class="remote-cam">📷 Câmera de ${nome}</div>`;
                } else {
                    card.innerHTML = `<div class="no-video"><span>${nome.charAt(0)}</span><p>${nome}</p></div>`;
                }
                grid.appendChild(card);
            });
        }
    });
}

window.toggleCam = async () => {
    const btn = document.getElementById("btnCam");
    if (!camAtiva) {
        try {
            streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            camAtiva = true;
            btn.classList.add("active-btn");
        } catch (err) { alert("Câmera bloqueada."); return; }
    } else {
        streamLocal.getTracks().forEach(t => t.stop());
        camAtiva = false;
        btn.classList.remove("active-btn");
    }
    await updateDoc(doc(db, "call", "global"), { [`status_${user.nome}`]: camAtiva });
};

window.entrarNaCall = async () => {
    const d = await getDocs(collection(db, "call"));
    const p = d.docs[0].data().participantes || [];
    if(p.length >= 4) { alert("Call lotada!"); return; }
    
    document.getElementById("telaCall").classList.add("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayUnion(user.nome) });
};

window.sairChamada = async () => {
    if(streamLocal) streamLocal.getTracks().forEach(t => t.stop());
    camAtiva = false;
    document.getElementById("telaCall").classList.remove("active");
    await updateDoc(doc(db, "call", "global"), { 
        participantes: arrayRemove(user.nome),
        [`status_${user.nome}`]: false 
    });
};

function escutarMensagens() {
    const box = document.getElementById("chatMsgs");
    onSnapshot(query(collection(db,"mensagens"),orderBy("createdAt", "asc")), snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const id = docSnap.id;
            const div = document.createElement("div");
            div.className = d.nome === user.nome ? "msg me" : "msg";
            let likes = d.liked ? `<span class="heart-pop">❤️</span>` : "";

            if(d.tipo === "call_invite") {
                div.innerHTML = `<div class="call-invite-msg"><b>${d.nome}</b> ${d.texto} <br><button onclick="entrarNaCall()">ENTRAR</button></div>`;
            } else {
                div.innerHTML = `<span class="sender">${d.nome}</span><p>${d.texto}</p>${likes}`;
            }
            div.ondblclick = () => updateDoc(doc(db, "mensagens", id), { liked: !d.liked });
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.enviarMsg = async () => {
    const input = document.getElementById("msgInput");
    if(!input.value.trim()) return;
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: input.value, createdAt: serverTimestamp(), liked: false });
    input.value = "";
};

window.abrirPerfil = () => document.getElementById("painelPerfil").classList.add("active");
window.fecharPerfil = () => document.getElementById("painelPerfil").classList.remove("active");
window.fechar = () => { side.classList.remove("open"); btnFlutuante.style.display = "flex"; };
window.toggleMic = () => {
    micAtivo = !micAtivo;
    if(streamLocal) streamLocal.getAudioTracks().forEach(t => t.enabled = micAtivo);
    document.getElementById("btnMic").style.background = micAtivo ? "" : "#ff4444";
};
</script>

<style>
:root { --main: #00f2ff; --bg: #000; --card: #111; }
body { margin:0; background: var(--bg); color:#fff; font-family: 'Segoe UI', sans-serif; height:100vh; overflow:hidden; }

/* NOTIFICAÇÃO DE CALL NO TOPO */
.call-notif { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 100; transform: translateY(-100px); transition: 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.2); }
.call-notif.show { transform: translateY(0); }
.notif-content { background: var(--main); color: #000; padding: 12px 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0,242,255,0.4); font-weight: bold; }
.notif-content button { background: #000; color: #fff; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 12px; }

/* GRADE DE CALL */
.call-grid { display: grid; gap: 10px; width: 95%; height: 70vh; padding: 10px; }
.count-1 { grid-template-columns: 1fr; }
.count-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
.count-3, .count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

.video-card { background: var(--card); border-radius: 25px; overflow: hidden; border: 1px solid #222; display: flex; align-items: center; justify-content: center; position: relative; }
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.no-video span { width: 80px; height: 80px; background: var(--main); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; font-weight: bold; margin-bottom: 10px; }

/* CHAT */
.chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-bottom: 1px solid #222; }
.header-center { font-weight: bold; color: var(--main); letter-spacing: 1px; }
.icon-btn { background: #222; border: none; width: 42px; height: 42px; border-radius: 50%; color: var(--main); font-size: 20px; }
.chat-wrapper { display: flex; flex-direction: column; height: calc(100% - 70px); position: relative; }
#chatMsgs { flex:1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { background: #1a1a1a; padding: 12px 18px; border-radius: 20px 20px 20px 5px; max-width: 80%; align-self: flex-start; border: 1px solid #222; position: relative; }
.msg.me { background: var(--main); color: #000; align-self: flex-end; border-radius: 20px 20px 5px 20px; border: none; font-weight: 500; }
.heart-pop { position: absolute; bottom: -10px; right: -5px; background: #000; border-radius: 50%; padding: 3px 6px; font-size: 14px; border: 1px solid #333; animation: pop 0.3s; }

.call-invite-msg { background: #222; color: var(--main); padding: 15px; border-radius: 15px; text-align: center; border: 1px dashed var(--main); width: 100%; box-sizing: border-box; }
.call-invite-msg button { margin-top: 10px; background: var(--main); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; width: 100%; }

.chat-bar { padding: 15px; background: #111; display: flex; gap: 10px; }
.chat-bar input { flex:1; background:#000; border:1px solid #333; padding:15px; border-radius:25px; color:#fff; }
.send-btn { background: var(--main); border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; }

/* CALL OVERLAY */
.call-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.call-overlay.active { display: flex; }
.controles-call { display: flex; gap: 20px; margin-top: 25px; }
.btn-ctrl { width: 65px; height: 65px; border-radius: 50%; border: none; background: #222; color: #fff; font-size: 26px; }
.active-btn { background: var(--main) !important; color: #000 !important; }
.btn-hangup { background: #ff4444 !important; }

/* PERFIL */
.perfil-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1100; display: none; align-items: center; justify-content: center; }
.perfil-overlay.active { display: flex; }
.perfil-box { width: 85%; background: #111; padding: 30px; border-radius: 30px; border: 1px solid var(--main); text-align: center; }
.avatar-grande { font-size: 60px; background: #222; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 2px solid var(--main); }

.screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; }
.screen.active { opacity:1; pointer-events:all; }
.panel { position: fixed; inset: 0; background: #000; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 500; }
.panel.open { transform: translateX(0); }
.menu button { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; background: var(--main); border: none; position: fixed; bottom: 30px; right: 25px; box-shadow: 0 0 20px rgba(0,242,255,0.4); }

@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body>
<div id="scrReg" class="screen"><div class="box" style="background:#111; border:1px solid #222; padding:30px; border-radius:25px; text-align:center; width:85%">
    <h2 style="color:var(--main); margin-bottom:20px">Chat Real ✨</h2>
    <form id="formReg">
        <input id="n" placeholder="Seu lindo nome" required>
        <input type="date" id="regData" required>
        <select id="regGen"><option>Masculino</option><option>Feminino</option></select>
        <textarea id="regBio" placeholder="Sua bio de cria"></textarea>
        <button style="background:var(--main); padding:15px; border-radius:15px; border:none; width:100%; font-weight:bold; margin-top:10px; color:#000">ENTRAR</button>
    </form>
</div></div>
<div id="scrApp" class="screen">
    <div id="btnFlutuante" class="menu"><button onclick="abrirChat()">💬</button></div>
    <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
</div>
</body>
</html>
