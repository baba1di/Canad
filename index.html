<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real-Time</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
query, orderBy, deleteDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
authDomain:"chat-app-c974a.firebaseapp.com",
projectId:"chat-app-c974a",
storageBucket:"chat-app-c974a.appspot.com",
messagingSenderId:"753329556773",
appId:"1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user"));
let unsubscribe = null;

window.onload = ()=>{
if(user && user.nome){
startApp();
}else{
scrReg.classList.add("active");
}

formReg.onsubmit = (e)=>{
e.preventDefault();
user = { nome: n.value, data: d.value, genero: g.value, bio: b.value };
localStorage.setItem("user", JSON.stringify(user));
startApp();
};
};

function startApp(){
scrReg.classList.remove("active");
scrApp.classList.add("active");
wlc.innerText = "Conectado como " + user.nome;
}

window.abrirChat = ()=>{
sideContent.innerHTML = `
<div class="chat-real">
    <div id="chatMsgs"></div>
    <div class="chat-bar">
        <input id="msgInput" placeholder="Mensagem real..." onkeypress="if(event.key==='Enter') enviarMsg()">
        <button onclick="enviarMsg()">➤</button>
    </div>
</div>
`;

side.classList.add("open");
const box = document.getElementById("chatMsgs");

if(unsubscribe) unsubscribe();

unsubscribe = onSnapshot(
query(collection(db,"mensagens"),orderBy("createdAt")),
snap=>{
box.innerHTML="";
snap.forEach(docSnap=>{
const d = docSnap.data();
const id = docSnap.id;
const div = document.createElement("div");
div.className = d.nome === user.nome ? "msg me" : "msg";
div.innerHTML = `<b>${d.nome}</b><p>${d.texto}</p>`;

// Apagar de verdade no Firebase
div.oncontextmenu = (e)=>{
e.preventDefault();
if(d.nome === user.nome && confirm("Apagar mensagem para todos?")){
deleteDoc(doc(db,"mensagens",id));
}
};
box.appendChild(div);
});
// Rolagem automática real
box.scrollTop = box.scrollHeight;
});
};

window.enviarMsg = async ()=>{
const txt = msgInput.value.trim();
if(!txt) return;
await addDoc(collection(db,"mensagens"),{
nome:user.nome,
texto:txt,
createdAt: Date.now()
});
msgInput.value="";
};

window.fechar = ()=>{
side.classList.remove("open");
if(unsubscribe) unsubscribe();
};
</script>
<style>
/* Reset e Base Real */
body{ margin:0; background:#000; color:#fff; font-family: sans-serif; height:100vh; overflow:hidden; }

.screen{ position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition: .2s; }
.screen.active{ opacity:1; pointer-events:all; }

.box{ background:#111; padding:20px; border-radius:15px; width:85%; border:1px solid #222; }

input, select, textarea { width:100%; padding:12px; margin:5px 0; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff; box-sizing:border-box; }
button{ width:100%; padding:12px; background:#00f2ff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }

/* Menu */
.menu{ position:fixed; bottom:20px; right:20px; z-index:10; }
.menu button{ width:60px; height:60px; border-radius:50%; font-size:25px; box-shadow: 0 0 15px #00f2ff55; }

/* Painel de Chat Real */
.panel{ position:fixed; right:-100%; top:0; width:100%; height:100%; background:#05070a; transition:.3s ease-out; display:flex; flex-direction:column; }
.panel.open{ right:0; }

.chat-real { display:flex; flex-direction:column; height:100%; overflow:hidden; }

/* O ARRASTAR DE VERDADE */
#chatMsgs{
flex:1;
overflow-y: auto; /* Permite o scroll real */
padding: 15px;
display: flex;
flex-direction: column;
gap: 8px;
-webkit-overflow-scrolling: touch; /* Suavidade nativa do celular */
}

.msg{ background:#1a1d23; padding:10px 14px; border-radius:15px 15px 15px 2px; max-width:80%; align-self:flex-start; border: 1px solid #222; }
.msg.me{ background:#00f2ff; color:#000; align-self:flex-end; border-radius:15px 15px 2px 15px; border:none; }
.msg b{ font-size:10px; display:block; margin-bottom:3px; opacity:0.7; }
.msg p{ margin:0; font-size:15px; line-height:1.3; }

/* Barra Fixa */
.chat-bar{ padding:10px; background:#000; display:flex; gap:8px; border-top:1px solid #111; }
.chat-bar input{ margin:0; border-radius:20px; background:#111; }
.chat-bar button{ width:50px; margin:0; border-radius:50%; }

.voltar{ padding:15px; color:#00f2ff; background:none; border:none; text-align:left; width:fit-content; font-size:16px; }
</style>
</head>
<body>

<div id="scrReg" class="screen">
<div class="box">
<h2 style="margin:0 0 15px 0">Entrar no Chat</h2>
<form id="formReg">
<input id="n" placeholder="Seu Nome" required>
<input type="date" id="d" required>
<select id="g"><option>Masculino</option><option>Feminino</option></select>
<textarea id="b" placeholder="Bio..."></textarea>
<button>ACESSAR</button>
</form>
</div>
</div>

<div id="scrApp" class="screen">
<div class="menu"><button onclick="abrirChat()">💬</button></div>
<h2 id="wlc" style="opacity:0.3"></h2>
<div id="side" class="panel">
<button class="voltar" onclick="fechar()">❮ Voltar</button>
<div id="sideContent" style="flex:1; overflow:hidden;"></div>
</div>
</div>

</body>
</html>
