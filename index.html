<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vibe Premium Ultra ✨</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Ícones Phosphor para o botão de salvar -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<style>
    /* MANTENDO SEU CSS ORIGINAL */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
    
    #app-switcher {
        display: flex; background: #111; border-bottom: 1px solid #222;
        position: fixed; top: 0; left: 0; width: 100%; height: 50px; z-index: 10000;
        justify-content: space-around; align-items: center;
    }
    .switch-btn {
        background: none; border: none; color: #666; font-weight: bold; font-size: 12px;
        cursor: pointer; padding: 10px; transition: 0.3s; display: flex; align-items: center; gap: 5px;
    }
    .switch-btn.active { color: #00f2ff; border-bottom: 2px solid #00f2ff; }

    .main-wrapper { margin-top: 50px; height: calc(100vh - 50px); position: relative; }
    .app-page { position: absolute; inset: 0; display: none; }
    .app-page.active { display: block; }

    :root { --main: #00f2ff; --bg: #000; }
    .chat-header { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 15px; background: #111; border-bottom: 1px solid #222;
        position: relative; z-index: 1001; 
    }
    .icon-btn { background: #222; border: none; width: 45px; height: 45px; border-radius: 50%; color: var(--main); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .chat-wrapper { display: flex; flex-direction: column; height: calc(100% - 75px); position: relative; }
    #chatMsgs { flex:1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;}
    .msg { background: #1a1a1a; padding: 10px 15px; border-radius: 18px; max-width: 80%; align-self: flex-start; position: relative; border: 1px solid #222; display: flex; flex-direction: column; }
    .msg.me { background: var(--main); color: #000; align-self: flex-end; border: none; }
    
    .msg-top { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
    .user-icon-msg { cursor: pointer; font-size: 14px; background: #333; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; position: relative; font-weight: bold; color: var(--main); text-transform: uppercase; }

    .bear-icon { position: absolute; bottom: 8px; right: 10px; width: 18px; height: 18px; opacity: 1; filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }
    .msg.me .bear-icon { color: #000; }
    .msg:not(.me) .bear-icon { color: var(--main); }

    .heart-pop { position: absolute; bottom: -8px; right: -5px; background: #000; border-radius: 50%; padding: 2px 5px; border: 1px solid #333; font-size: 14px; }
    .private-msg { border: 1px dashed var(--main) !important; background: rgba(0, 242, 255, 0.05) !important; }
    
    .at-box { position: absolute; bottom: 70px; left: 10px; background: #111; border: 1px solid var(--main); border-radius: 12px; width: 200px; display: none; z-index: 10002; max-height: 150px; overflow-y: auto; }
    .at-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; color: var(--main); }

    .chat-bar { padding: 10px; background: #111; display: flex; gap: 10px; align-items: center; }
    .chat-bar input { flex:1; background:#000; border:1px solid #333; padding:12px; border-radius:20px; color:#fff; outline:none; }
    .send-btn { background: var(--main); border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    
    .menu-btn-float button { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; background: var(--main); border: none; position: fixed; bottom: 30px; right: 25px; box-shadow: 0 0 15px var(--main); cursor: pointer; z-index: 999;}
    .panel { position: fixed; inset: 0; background: #000; transform: translateX(100%); transition: 0.3s; z-index: 11000; }
    .panel.open { transform: translateX(0); }
    .screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; z-index: 20000; background: rgba(0,0,0,0.9); transition: 0.3s; }
    .screen.active { opacity:1; pointer-events:all; }
    .save-btn { background: var(--main); color: #000; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    input, select, textarea { width: 100%; padding: 15px; margin-top: 10px; background: #000; border: 1px solid #222; border-radius: 12px; color: #fff; }

    .badge-verificado { color: #00f2ff; font-size: 10px; margin-left: 2px; }
    .mini-verif { position: absolute; bottom: -4px; right: -4px; font-size: 9px; color: #00f2ff; background: #000; border-radius: 50%; }

    /* CALLS */
    .call-overlay { position: fixed; inset: 0; background: #000; z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .call-overlay.active { display: flex; }
    .call-grid { display: grid; gap: 12px; width: 95%; height: 75vh; grid-template-columns: 1fr 1fr; align-content: center; }
    .video-card { background: #111; border-radius: 20px; overflow: hidden; border: 2px solid #222; position: relative; height: 100%; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .meu-video { transform: scaleX(-1); }
    .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 8px; font-size: 12px; color: #00f2ff; }
    .controles-call { display: flex; gap: 20px; margin-top: 30px; }
    .btn-hangup { background: #ff4444 !important; color: #fff !important; width: 60px !important; height: 60px !important; }

    /* PERFIL */
    .avatar-grande { width: 80px; height: 80px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 15px; border: 2px solid var(--main); position: relative; font-weight: bold; color: var(--main); text-transform: uppercase; }
    .stats-container { display: flex; justify-content: space-around; margin: 15px 0; border-top: 1px solid #222; padding-top: 10px; }
    .stat-val { display: block; font-weight: bold; color: var(--main); font-size: 18px; }
    .stat-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
    .btn-seguir { background: #fff; color: #000; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-seguir.seguindo { background: #333; color: #fff; }

    /* MÚSICA */
    #pageMusic { background: #0b0e14; overflow-y: auto; height: 100%; }
    .music-header { padding: 20px; display: flex; flex-direction: column; background: rgba(11, 14, 20, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; position: sticky; top:0; z-index: 10;}
    .music-nav { display: flex; gap: 20px; margin-bottom: 15px; }
    .music-nav-btn { background: none; border: none; color: #666; font-size: 14px; font-weight: bold; cursor: pointer; }
    .music-nav-btn.active { color: #fff; border-bottom: 2px solid #fff; }
    
    .search-bar-music { display: flex; align-items: center; background: #1a1f29; border-radius: 12px; padding: 5px 15px; width: 100%; border: 1px solid transparent; }
    .search-bar-music input { background: transparent; border: none; padding: 10px; color: white; flex: 1; outline: none; }
    #music-grid, #saved-music-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding-bottom: 120px; }
    .card { background: #1a1f29; padding: 12px; border-radius: 16px; cursor: pointer; position: relative; }
    .card img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
    .music-footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: #0b0e14; border-top: 1px solid #1e293b; padding: 0 20px; display: flex; align-items: center; z-index: 9000; }

    /* BOTÃO SALVAR AMARELO + ANIMAÇÃO */
    .save-button-inner {
        position: absolute; top: 15px; right: 15px;
        width: 35px; height: 35px; border-radius: 50%;
        background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        border: 1px solid #333; z-index: 5;
    }
    .save-button-inner i { font-size: 20px; color: #fff; transition: 0.3s; }
    
    /* ESTADO SALVO: AMARELO + PULSO */
    .save-button-inner.saved { 
        border-color: #ffd700; 
        background: rgba(255, 215, 0, 0.3); 
        transform: scale(1.1);
        animation: savePulse 0.4s ease-out;
    }
    .save-button-inner.saved i { color: #ffd700; }

    @keyframes savePulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.4); }
        100% { transform: scale(1.1); }
    }

    /* NOTIFICAÇÃO */
    .notification-btn.active { background: #00f2ff; color: #000; box-shadow: 0 0 25px #00f2ff; }
    .notif-item { padding: 12px; border-bottom: 1px solid #222; font-size: 13px; display: flex; align-items: center; gap: 10px; animation: fadeIn 0.3s; }
    .notif-time { font-size: 10px; opacity: 0.5; margin-left: auto; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc, limit, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqgPPmWG6cM3xpFLtOBjQJ8PmAVV7YgaY",
  authDomain: "chatt-4bfcd.firebaseapp.com",
  databaseURL: "https://chatt-4bfcd-default-rtdb.firebaseio.com",
  projectId: "chatt-4bfcd",
  storageBucket: "chatt-4bfcd.firebasestorage.app",
  messagingSenderId: "1056039006721",
  appId: "1:1056039006721:web:7df8605c6dc1b77b460600"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo")) || {};
let meuPeer = null;
let streamLocal = null;
let listaUsuarios = [];
let databaseUsuarios = {};
let unsubMsgs = null;
let audioAtual = null;
let musicasSalvas = JSON.parse(localStorage.getItem("musicas_salvas")) || [];

const API_KEY_CORRETOR = "cTTUEHXN5jEg3bpM";
const girias = { "vc":"você", "vcs":"vocês", "tb":"também", "pq":"porque", "n":"não", "ja":"já", "eh":"é" };

const byId = (id) => document.getElementById(id);
const escapeHtml = (str = "") => String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]);

const pandaSvg = `<svg class="bear-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 17.25h1.5L12 18z"/><path d="m15 12 2 2"/><path d="M18 6.5a.5.5 0 0 0-.5-.5"/><path d="M20.69 9.67a4.5 4.5 0 1 0-7.04-5.5 8.35 8.35 0 0 0-3.3 0 4.5 4.5 0 1 0-7.04 5.5C2.49 11.2 2 12.88 2 14.5 2 19.47 6.48 22 12 22s10-2.53 10-7.5c0-1.62-.48-3.3-1.3-4.83"/><path d="M6 6.5a.495.495 0 0 1 .5-.5"/><path d="m9 12-2 2"/></svg>`;

const iconSeguir = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>`;
const iconDeixarSeguir = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="M22 19h-6"/></svg>`;

function formatarNumero(num) {
    if (!num) return 0;
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num;
}

function checarVerificado(nome, seguidoresCount) {
    const oficiais = ["Ka", "ISAAC"];
    return oficiais.includes(nome) || seguidoresCount >= 1000;
}

async function realizarCorrecao(textoOriginal) {
    let textoProcessado = textoOriginal.split(" ").map(p => girias[p.toLowerCase()] || p).join(" ");
    try {
        const res = await fetch(`https://api.textgears.com/grammar?text=${encodeURIComponent(textoProcessado)}&language=pt-BR&key=${API_KEY_CORRETOR}`);
        const data = await res.json();
        if (data.response && data.response.errors) {
            data.response.errors.reverse().forEach(e => { if(e.better.length) textoProcessado = textoProcessado.substring(0, e.offset) + e.better[0] + textoProcessado.substring(e.offset + e.length); });
        }
    } catch (e) {}
    return textoProcessado.charAt(0).toUpperCase() + textoProcessado.slice(1);
}

window.switchApp = (appId, btn) => {
    document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
    byId(appId).classList.add('active');
    btn.classList.add('active');
};

window.addEventListener("DOMContentLoaded", () => {
    if (user && user.nome) startApp(); else byId("scrReg").classList.add("active");
    byId("formReg").onsubmit = async (e) => {
        e.preventDefault();
        user = { nome: byId("n").value.trim(), data: byId("regData").value, genero: byId("regGen").value, bio: byId("regBio").value, seguidores: [], seguindo: [] };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
});

async function registrarNotificacao(tipo, quem, para) {
    if(quem === para) return;
    await addDoc(collection(db, "notificacoes"), {
        tipo: tipo, de: quem, para: para, timestamp: serverTimestamp(), lida: false
    });
}

async function startApp() {
    byId("scrReg").classList.remove("active");
    meuPeer = new Peer((user.nome || "anon").replace(/\s+/g, '_').toLowerCase());
    meuPeer.on('call', (call) => { 
        registrarNotificacao("ligou", call.peer, user.nome);
        call.answer(streamLocal); 
        call.on('stream', (rs) => addVideoRemoto(call.peer, rs)); 
    });
    await setDoc(doc(db, "usuarios_online", user.nome), { nome: user.nome, lastSeen: serverTimestamp(), bio: user.bio, seguidores: user.seguidores, seguindo: user.seguindo }, { merge: true });
    onSnapshot(collection(db, "usuarios_online"), snap => {
        listaUsuarios = [];
        snap.forEach(d => {
            const data = d.data();
            databaseUsuarios[data.nome] = data;
            listaUsuarios.push(data.nome);
            if(data.nome === user.nome) { user.seguidores = data.seguidores || []; user.seguindo = data.seguindo || []; }
        });
    });
    escutarMensagens();
}

window.abrirChat = () => {
    byId("btnFlutuante").style.display = "none";
    byId("sideContent").innerHTML = `
        <div class="chat-header">
            <button onclick="fechar()" style="background:none;border:none;color:#fff;font-size:20px">❮</button>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="icon-btn" id="bellBtn" onclick="toggleNotificacoes()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
                </button>
                <button class="icon-btn" onclick="entrarNaCall()">📞</button>
                <button class="icon-btn" onclick="abrirMeuPerfil()">👤</button>
            </div>
        </div>
        <div class="chat-wrapper">
            <div id="notifPanel" style="display:none; background:#111; border-bottom:1px solid #222; max-height:200px; overflow-y:auto;"></div>
            <div id="chatMsgs"></div>
            <div id="atList" class="at-box"></div>
            <div class="chat-bar">
                <input id="msgInput" placeholder="Escreva aqui..." oninput="checarAt(this)" onkeypress="if(event.key === 'Enter') enviarMsg()">
                <button class="send-btn" onclick="enviarMsg()">➤</button>
            </div>
        </div>
    `;
    byId("side").classList.add("open");
    escutarMensagens();
};

window.toggleNotificacoes = () => {
    const btn = byId('bellBtn');
    const panel = byId('notifPanel');
    btn.classList.toggle('active');
    if (panel.style.display === "none") {
        panel.style.display = "block";
        carregarNotificacoes();
    } else {
        panel.style.display = "none";
    }
};

async function carregarNotificacoes() {
    const panel = byId('notifPanel');
    panel.innerHTML = '<div style="padding:10px; font-size:11px; color:#666;">Carregando alertas...</div>';
    const q = query(collection(db, "notificacoes"), orderBy("timestamp", "desc"), limit(10));
    const snap = await getDocs(q);
    let html = "";
    snap.forEach(d => {
        const data = d.data();
        if(data.para === user.nome) {
            let icone = "🔔"; let texto = "";
            if(data.tipo === "seguiu") { icone = "➕"; texto = `<b>${data.de}</b> começou a te seguir!`; }
            if(data.tipo === "parou") { icone = "➖"; texto = `<b>${data.de}</b> parou de te seguir.`; }
            if(data.tipo === "perfil") { icone = "👀"; texto = `<b>${data.de}</b> visitou seu perfil!`; }
            if(data.tipo === "mencao") { icone = "🏷️"; texto = `<b>${data.de}</b> te marcou no chat!`; }
            if(data.tipo === "ligou") { icone = "📞"; texto = `<b>${data.de}</b> te ligou!`; }
            html += `<div class="notif-item">${icone} ${texto}</div>`;
        }
    });
    panel.innerHTML = html || '<div style="padding:20px; text-align:center; opacity:0.5; font-size:12px;">Nenhuma atividade nova.</div>';
}

function escutarMensagens() {
    const box = byId("chatMsgs");
    if(!box) return;
    if(unsubMsgs) unsubMsgs();
    const q = query(collection(db,"mensagens"), orderBy("createdAt", "asc"));
    unsubMsgs = onSnapshot(q, snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const destino = (d.texto.match(/@(\S+)/) || [])[1];
            if (!destino || d.nome === user.nome || destino === user.nome) {
                const div = document.createElement("div");
                div.className = d.nome === user.nome ? "msg me" : "msg";
                if(destino) div.classList.add("private-msg");
                const verif = checarVerificado(d.nome, (databaseUsuarios[d.nome]?.seguidores || []).length);
                div.innerHTML = `
                    <div class="msg-top">
                        <span class="user-icon-msg" onclick="decidirPerfil('${d.nome}')">${d.nome.charAt(0)}${verif ? '<i class="fa-solid fa-circle-check mini-verif"></i>' : ''}</span>
                        <span style="font-size:10px;opacity:0.8;font-weight:bold;">${d.nome}${verif ? '<i class="fa-solid fa-circle-check badge-verificado"></i>' : ''}</span>
                    </div>
                    <p>${escapeHtml(d.texto)}</p>
                    ${pandaSvg}
                    ${d.liked ? '<span class="heart-pop">❤️</span>' : ''}
                `;
                div.ondblclick = () => updateDoc(doc(db, "mensagens", docSnap.id), { liked: !d.liked });
                box.appendChild(div);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.decidirPerfil = (nomeClicado) => {
    if (nomeClicado === user.nome) {
        abrirMeuPerfil();
    } else {
        verPerfilExterno(nomeClicado);
    }
};

window.enviarMsg = async () => {
    const input = byId("msgInput");
    const val = input.value.trim();
    if (!val) return;
    const mencao = (val.match(/@(\S+)/) || [])[1];
    if(mencao) registrarNotificacao("mencao", user.nome, mencao);
    input.value = "..."; input.disabled = true;
    const txt = await realizarCorrecao(val);
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: txt, createdAt: serverTimestamp(), liked: false });
    input.value = ""; input.disabled = false; input.focus(); byId("atList").style.display = "none";
};

window.entrarNaCall = async () => {
    byId("telaCall").classList.add("active");
    streamLocal = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    addVideoRemoto(meuPeer.id, streamLocal, true);
    listaUsuarios.forEach(n => { 
        if(n !== user.nome) {
            registrarNotificacao("ligou", user.nome, n);
            meuPeer.call(n.replace(/\s+/g, '_').toLowerCase(), streamLocal).on('stream', rs => addVideoRemoto(n, rs)); 
        }
    });
};

window.addVideoRemoto = (id, stream, isMe = false) => {
    const grid = byId("callGrid");
    let card = byId(`card_${id}`);
    if (!card) { card = document.createElement("div"); card.className = "video-card"; card.id = `card_${id}`; grid.appendChild(card); }
    const v = document.createElement("video"); v.autoplay = true; v.playsinline = true; v.srcObject = stream;
    if(isMe) { v.muted = true; v.className = "meu-video"; }
    card.innerHTML = `<div class="video-label">${isMe ? 'Você' : id}</div>`; card.appendChild(v);
};

window.verPerfilExterno = async (n) => {
    registrarNotificacao("perfil", user.nome, n);
    const d = (await getDoc(doc(db, "usuarios_online", n))).data();
    const ja = (d.seguidores || []).includes(user.nome);
    const verif = checarVerificado(n, (d.seguidores || []).length);
    byId("perfilExternoContent").innerHTML = `
        <div class="avatar-grande">${n.charAt(0)}${verif ? '<i class="fa-solid fa-circle-check mini-verif"></i>' : ''}</div>
        <h2 style="text-align:center">${n}${verif ? '<i class="fa-solid fa-circle-check badge-verificado"></i>' : ''}</h2>
        <div class="stats-container">
            <div class="stat-item"><span class="stat-val">${formatarNumero(d.seguidores.length)}</span><span class="stat-label">Seguidores</span></div>
            <div class="stat-item"><span class="stat-val">${formatarNumero(d.seguindo.length)}</span><span class="stat-label">Seguindo</span></div>
        </div>
        <button class="btn-seguir ${ja ? 'seguindo' : ''}" onclick="toggleSeguir('${n}')">
            ${ja ? iconDeixarSeguir + ' Parar de Seguir' : iconSeguir + ' Seguir'}
        </button>
    `;
    byId("painelExterno").classList.add("active");
};

window.toggleSeguir = async (n) => {
    const refAlvo = doc(db, "usuarios_online", n);
    const refEu = doc(db, "usuarios_online", user.nome);
    const snap = await getDoc(refAlvo);
    if((snap.data().seguidores || []).includes(user.nome)) {
        await updateDoc(refAlvo, { seguidores: arrayRemove(user.nome) }); 
        await updateDoc(refEu, { seguindo: arrayRemove(n) });
        registrarNotificacao("parou", user.nome, n);
    } else {
        await updateDoc(refAlvo, { seguidores: arrayUnion(user.nome) }); 
        await updateDoc(refEu, { seguindo: arrayUnion(n) });
        registrarNotificacao("seguiu", user.nome, n);
    }
    verPerfilExterno(n);
};

window.abrirMeuPerfil = () => { 
    byId("editNome").value = user.nome; 
    byId("editBio").value = user.bio || ""; 
    atualizarVisualPerfil(); 
    byId("painelPerfil").classList.add("active"); 
};

function atualizarVisualPerfil() { 
    const verif = checarVerificado(user.nome, user.seguidores.length);
    byId("meuAvatarPerfil").innerHTML = `${user.nome.charAt(0)}${verif ? '<i class="fa-solid fa-circle-check mini-verif"></i>' : ''}`;
    byId("meusSeguidores").textContent = formatarNumero(user.seguidores.length); 
    byId("meusSeguindo").textContent = formatarNumero(user.seguindo.length);
}

window.salvarPerfil = async () => {
    const novoNome = byId("editNome").value.trim();
    const novaBio = byId("editBio").value;
    if(novoNome && novoNome !== user.nome) {
        await deleteDoc(doc(db, "usuarios_online", user.nome));
        user.nome = novoNome;
    }
    user.bio = novaBio;
    localStorage.setItem("user_completo", JSON.stringify(user));
    await setDoc(doc(db, "usuarios_online", user.nome), { 
        nome: user.nome, bio: user.bio, lastSeen: serverTimestamp(), 
        seguidores: user.seguidores, seguindo: user.seguindo 
    }, { merge: true });
    location.reload();
};

window.checarAt = (i) => {
    const val = i.value.split(/\s+/).pop();
    if(val.startsWith("@")) {
        const matches = listaUsuarios.filter(u => u.toLowerCase().startsWith(val.slice(1).toLowerCase()) && u !== user.nome);
        byId("atList").innerHTML = matches.map(u => `<div class="at-item" onclick="selecionarAt('${u}')">${u}</div>`).join("");
        byId("atList").style.display = matches.length ? "block" : "none";
    } else byId("atList").style.display = "none";
};

window.selecionarAt = (n) => {
    const i = byId("msgInput"); const p = i.value.split(/\s+/); p.pop();
    i.value = (p.length ? p.join(" ") + " " : "") + "@" + n + " ";
    byId("atList").style.display = "none"; i.focus();
};

window.sairChamada = () => { location.reload(); };
window.fechar = () => { byId("side").classList.remove("open"); byId("btnFlutuante").style.display = "flex"; };
window.fecharMeuPerfil = () => byId("painelPerfil").classList.remove("active");
window.fecharPerfilExterno = () => byId("painelExterno").classList.remove("active");

/* LÓGICA DE MÚSICA */
window.switchMusicTab = (tab) => {
    document.querySelectorAll('.music-nav-btn').forEach(b => b.classList.remove('active'));
    if(tab === 'search') {
        byId('btnMusicSearch').classList.add('active');
        byId('music-grid').style.display = 'grid';
        byId('saved-music-grid').style.display = 'none';
        byId('search-bar-container').style.display = 'flex';
    } else {
        byId('btnMusicSaved').classList.add('active');
        byId('music-grid').style.display = 'none';
        byId('saved-music-grid').style.display = 'grid';
        byId('search-bar-container').style.display = 'none';
        renderSavedMusic();
    }
};

window.performSearch = () => {
    const q = byId('music-input').value;
    if(!q) return;
    const s = document.createElement('script'); s.src = `https://api.deezer.com/search?q=${encodeURIComponent(q)}&output=jsonp&callback=displayResults`;
    document.body.appendChild(s);
};

window.displayResults = (r) => {
    byId('music-grid').innerHTML = r.data.map(t => {
        const isSaved = musicasSalvas.some(m => m.id === String(t.id));
        return `
        <div class="card">
            <div id="btn_save_${t.id}" class="save-button-inner ${isSaved ? 'saved' : ''}" onclick="event.stopPropagation(); toggleSaveMusic('${t.id}', '${t.title.replace(/'/g, "")}', '${t.album.cover_medium}', '${t.preview}', '${t.artist.name.replace(/'/g, "")}')">
                <i class="ph ph-bookmark-simple"></i>
            </div>
            <div onclick="playM('${t.preview}', '${t.album.cover_medium}', '${t.title}')">
                <img src="${t.album.cover_medium}">
                <h4 style="font-size:13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${t.title}</h4>
                <p style="font-size:11px; opacity:0.6;">${t.artist.name}</p>
            </div>
        </div>`;
    }).join("");
};

window.toggleSaveMusic = (id, title, img, preview, artist) => {
    const index = musicasSalvas.findIndex(m => m.id === String(id));
    const btn = document.getElementById(`btn_save_${id}`);
    
    if(index > -1) {
        musicasSalvas.splice(index, 1);
        if(btn) btn.classList.remove('saved');
    } else {
        musicasSalvas.push({id: String(id), title, img, preview, artist});
        if(btn) btn.classList.add('saved');
    }
    
    localStorage.setItem("musicas_salvas", JSON.stringify(musicasSalvas));
    
    // Se estiver na aba de salvas, re-renderiza para atualizar a lista
    if(byId('btnMusicSaved').classList.contains('active')) {
        renderSavedMusic();
    }
};

function renderSavedMusic() {
    if(musicasSalvas.length === 0) {
        byId('saved-music-grid').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:50px; opacity:0.5;">Nenhuma música salva ainda.</div>';
        return;
    }
    byId('saved-music-grid').innerHTML = musicasSalvas.map(t => `
        <div class="card">
            <div id="btn_save_${t.id}" class="save-button-inner saved" onclick="event.stopPropagation(); toggleSaveMusic('${t.id}', '', '', '', '')">
                <i class="ph ph-bookmark-simple"></i>
            </div>
            <div onclick="playM('${t.preview}', '${t.img}', '${t.title}')">
                <img src="${t.img}">
                <h4 style="font-size:13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${t.title}</h4>
                <p style="font-size:11px; opacity:0.6;">${t.artist}</p>
            </div>
        </div>`).join("");
}

window.playM = (u, img, t) => {
    if(audioAtual) audioAtual.pause();
    byId('current-img').src = img; byId('current-img').style.display='block'; byId('current-title').textContent = t;
    audioAtual = new Audio(u); audioAtual.play();
};
</script>
</head>
<body>

<div id="scrReg" class="screen">
    <div style="background:#111; padding:30px; border-radius:25px; width:85%; text-align:center">
        <h2 style="color:#00f2ff; margin-bottom: 15px;">Bem-vindo ✨</h2>
        <form id="formReg">
            <input id="n" placeholder="Seu nome" required>
            <input type="date" id="regData" required>
            <select id="regGen"><option>Masculino</option><option>Feminino</option></select>
            <textarea id="regBio" placeholder="Sua bio"></textarea>
            <button class="save-btn">ENTRAR</button>
        </form>
    </div>
</div>

<div id="app-switcher">
    <button class="switch-btn active" onclick="switchApp('pageChat', this)">CONVERSAR 💬</button>
    <button class="switch-btn" onclick="switchApp('pageMusic', this)">
        MÚSICA <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><path d="m9 9 12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
</div>

<div class="main-wrapper">
    <div id="pageChat" class="app-page active">
        <div id="btnFlutuante" class="menu-btn-float"><button onclick="abrirChat()">💬</button></div>
        <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
        
        <div id="painelPerfil" class="screen">
            <div style="background:#111; padding:25px; border-radius:25px; width:85%; border:1px solid #00f2ff; position: relative;">
                <button style="position: absolute; top: 15px; right: 20px; background:none; border:none; color:#fff; font-size: 22px;" onclick="fecharMeuPerfil()">✕</button>
                <div class="avatar-grande" id="meuAvatarPerfil">👤</div>
                <div class="stats-container">
                    <div class="stat-item"><span id="meusSeguidores" class="stat-val">0</span><span class="stat-label">Seguidores</span></div>
                    <div class="stat-item"><span id="meusSeguindo" class="stat-val">0</span><span class="stat-label">Seguindo</span></div>
                </div>
                <div style="position: relative;">
                    <input id="editNome" placeholder="Nome">
                </div>
                <div style="position: relative;">
                    <textarea id="editBio" placeholder="Bio"></textarea>
                </div>
                <button class="save-btn" onclick="salvarPerfil()">SALVAR</button>
            </div>
        </div>

        <div id="painelExterno" class="screen">
            <div style="background:#111; padding:25px; border-radius:25px; width:85%; position: relative; border: 1px solid #222;">
                <button style="position: absolute; top: 15px; right: 20px; background:none; border:none; color:#fff; font-size: 22px;" onclick="fecharPerfilExterno()">✕</button>
                <div id="perfilExternoContent"></div>
            </div>
        </div>

        <div id="telaCall" class="call-overlay">
            <div class="call-grid" id="callGrid"></div>
            <div class="controles-call"><button class="icon-btn btn-hangup" onclick="sairChamada()">📞</button></div>
        </div>
    </div>

    <div id="pageMusic" class="app-page">
        <header class="music-header">
            <div class="music-nav">
                <button id="btnMusicSearch" class="music-nav-btn active" onclick="switchMusicTab('search')">EXPLORAR</button>
                <button id="btnMusicSaved" class="music-nav-btn" onclick="switchMusicTab('saved')">SALVAS ⭐</button>
            </div>
            <div class="search-bar-music" id="search-bar-container">
                <input type="text" id="music-input" placeholder="O que vamos ouvir?" onkeypress="if(event.key === 'Enter') performSearch()">
                <button style="background:none;border:none;font-size:20px" onclick="performSearch()">🔍</button>
            </div>
        </header>
        <main id="music-grid"></main>
        <main id="saved-music-grid" style="display:none;"></main>
        <footer class="music-footer">
            <div style="display:flex; align-items:center; gap:15px;">
                <img id="current-img" src="" style="width:55px; height:55px; border-radius:8px; display:none;">
                <div style="display: flex; flex-direction: column;">
                    <h4 id="current-title" style="font-size:14px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Nenhuma tocando</h4>
                </div>
            </div>
        </footer>
    </div>
</div>

</body>
</html>
