import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, doc, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadString, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

/* FIREBASE CONFIG (mantive o config existente) */
const firebaseConfig = {
  apiKey: "AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
  authDomain: "chat-app-c974a.firebaseapp.com",
  projectId: "chat-app-c974a",
  storageBucket: "chat-app-c974a.appspot.com",
  messagingSenderId: "753329556773",
  appId: "1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* ESTADO GLOBAL */
let user = JSON.parse(localStorage.getItem("user_completo")) || {};
let streamLocal = null;
let currentFacingMode = "user";
let audioCtx = null;
let voiceFilter = null;
let audioMuted = false;
let meuPeer = null;
let mediaRecorder = null;
let audioChunks = [];
let gravando = false;
let msgSelecionadaId = null;
let msgSelecionadaNome = null;
let listaUsuarios = [];
let msgsApagadasLocal = JSON.parse(localStorage.getItem("msgs_ocultas")) || [];
let respondendoA = null;

/* REFERÊNCIAS DOM (serão preenchidas no DOMContentLoaded) */
let scrReg, scrApp, formReg, nInput, regData, regGen, regBio, btnFlutuante, side, sideContent;

/* HELPERS */
function escapeHtml(str = "") {
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]);
}

function byId(id){ return document.getElementById(id); }

/* Inicialização DOM */
window.addEventListener("DOMContentLoaded", () => {
  scrReg = byId("scrReg");
  scrApp = byId("scrApp");
  formReg = byId("formReg");
  nInput = byId("n");
  regData = byId("regData");
  regGen = byId("regGen");
  regBio = byId("regBio");
  btnFlutuante = byId("btnFlutuante");
  side = byId("side");
  sideContent = byId("sideContent");

  if (user && user.nome) startApp();
  else scrReg?.classList.add("active");

  if (formReg) {
    formReg.onsubmit = (e) => {
      e.preventDefault();
      const nome = nInput.value.trim();
      if (!nome) return alert("Coloque seu nome");
      user = { nome, data: regData.value, genero: regGen.value, bio: regBio.value };
      localStorage.setItem("user_completo", JSON.stringify(user));
      startApp();
    };
  }

  document.addEventListener("click", (e) => {
    if (!e.target.closest('.menu-msg-box')) fecharMenuMsg();
    if (!e.target.closest('.at-box')) fecharAtList();
  });
});

/* START APP */
async function startApp(){
  scrReg?.classList.remove("active");
  scrApp?.classList.add("active");

  const peerId = (user.nome || "anon").replace(/\s+/g, '_').toLowerCase();
  // Usa PeerJS via <script> (incluso no head)
  meuPeer = new Peer(peerId);

  meuPeer.on('call', (call) => {
    call.answer(streamLocal);
    call.on('stream', (remoteStream) => addVideoRemoto(call.peer, remoteStream));
  });

  // registra usuário online
  try {
    await setDoc(doc(db, "usuarios_online", user.nome), { nome: user.nome, lastSeen: serverTimestamp(), digitando: false });
  } catch (err) { console.error(err); }

  // ouvir usuarios online e status digitando
  onSnapshot(collection(db, "usuarios_online"), snap => {
    listaUsuarios = [];
    const digitando = [];
    snap.forEach(d => {
      const data = d.data();
      if (data?.nome) {
        listaUsuarios.push(data.nome);
        if (data.digitando && data.nome !== user.nome) digitando.push(data.nome);
      }
    });
    atualizarDigitando(digitando);
  });

  // garante documento global de call
  try {
    await setDoc(doc(db, "call", "global"), { participantes: [] }, { merge: true });
  } catch (err) { console.error(err); }
}

/* UI helpers */
function atualizarDigitando(lista) {
  const el = byId("statusDigitando");
  if (!el) return;
  if (lista.length === 0) el.innerText = "";
  else if (lista.length === 1) el.innerText = `${lista[0]} está digitando...`;
  else if (lista.length === 2) el.innerText = `${lista[0]} e ${lista[1]} estão digitando...`;
  else el.innerText = "Várias pessoas digitando...";
}

/* Abrir Chat - rendera a UI interna dinamicamente */
window.abrirChat = () => {

  if (!sideContent) sideContent = byId("sideContent");
  sideContent.innerHTML = `

    <div class="chat-header">
        <button class="voltar-btn" onclick="fechar()">❮</button>
        <div class="header-center">Chat Real ✨</div>
        <div style="display:flex; gap:12px; align-items:center; z-index:1001">
            <button class="icon-btn" onclick="entrarNaCall()">📞</button>
            <button class="icon-btn" onclick="abrirPerfil()">👤</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="chatMsgs"></div>
        <div id="statusDigitando" class="status-digitando"></div>
        <div id="atList" class="at-box"></div>
        <div id="replyPreview" class="reply-preview"></div>
        <div id="avisoChatCall" class="aviso-chat-bottom"></div>
        <div class="chat-bar">

        <div class="menu-msg-box"><button class="btn-apagar" onclick="confirmarApagar()">🗑️ Apagar Mensagem</button></div>

            <select class="btn-ctrl" onchange="alterarVoz(this.value)" style="width:60px; font-size:12px;">

        </div>
    </div>
    <div id="painelPerfil" class="perfil-overlay" style="display:none">
        <div class="perfil-box">
            <button class="voltar-btn" style="float:right" onclick="fecharPerfil()">✕</button>
            <h3 style="color:var(--main)">Meu Perfil</h3>
            <div class="avatar-grande">👤</div>
            <input id="editNome" value="${escapeHtml(user.nome || '')}">
            <textarea id="editBio">${escapeHtml(user.bio || '')}</textarea>
            <button class="save-btn" onclick="salvarPerfil()">SALVAR ALTERAÇÕES</button>
        </div>
    </div>
  `;
  side?.classList.add("open");
  escutarMensagens();
  escutarCall();
  configurarGravador();

  // conecta eventos que precisam existir após render
  const btnAudio = byId("btnAudio");
  if (btnAudio) {
    // já conferido em configurarGravador que pointer events serão adicionados lá
  }

/* ESCUTAR MENSAGENS (com sanitização e suporte a imagens/áudio via Storage URLs) */
function escutarMensagens() {
  const box = byId("chatMsgs");
  if (!box) return;
  let primeiraCarga = true;

  const q = query(collection(db,"mensagens"), orderBy("createdAt", "asc"), limit(500)); // evita carregar ilimitado
  onSnapshot(q, snap => {
    box.innerHTML = "";
    snap.forEach(docSnap => {
      if (msgsApagadasLocal.includes(docSnap.id)) return;
      const d = docSnap.data();
      const texto = d?.texto || "";
      const mencao = texto?.match(/@(\S+)/);
      const destino = mencao ? mencao[1] : null;
      const ehPrivada = destino !== null;
      const paraMim = destino === user.nome;
      const euMandei = d?.nome === user.nome;

      if (!ehPrivada || euMandei || paraMim) {
        const div = document.createElement("div");
        div.className = euMandei ? "msg me" : "msg";
        if (ehPrivada) div.classList.add("private-msg");
        div.id = `msg_${docSnap.id}`;

        const replyHtml = d?.replyTo ? `<div class="reply-inside"><b>${escapeHtml(d.replyTo.nome)}:</b> ${escapeHtml(d.replyTo.texto)}</div>` : "";
        const heart = d?.liked ? `<span class="heart-pop">❤️</span>` : "";
        const tagPrivado = ehPrivada ? `<span class="lock-icon">🔒 Privado</span>` : "";

        let content = "";
        if (d?.fotoUrl) {
          content = `<img src="${escapeHtml(d.fotoUrl)}" class="img-mini" onclick="expandirFoto('${escapeHtml(d.fotoUrl)}')">`;
        } else if (d?.audioUrl) {
          content = `<audio controls src="${escapeHtml(d.audioUrl)}"></audio>`;
        } else {
          content = `<p>${escapeHtml(texto)}</p>`;
        }

        div.innerHTML = `${replyHtml}<span class="sender">${escapeHtml(d.nome)} ${tagPrivado}</span>${content}${heart}`;

        // clique simples para responder, duplo para curtir
        let clickTimer = null;
        div.onclick = (e) => {
          if (clickTimer) {
            clearTimeout(clickTimer);
            clickTimer = null;
          } else {
            clickTimer = setTimeout(() => {
              prepararResposta(d.nome, texto || (d.fotoUrl ? "Foto" : "Áudio"));
              clickTimer = null;
            }, 250);
          }
        };

        div.ondblclick = (e) => {
          e.stopPropagation();
          if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
          updateDoc(doc(db, "mensagens", docSnap.id), { liked: !d.liked }).catch(()=>{});
        };

        // long press -> abrir menu apagar
        let timer;
        const startTimer = () => { timer = setTimeout(() => abrirMenuMsg(docSnap.id, d.nome), 600); };
        const endTimer = () => { clearTimeout(timer); };
        div.addEventListener("pointerdown", startTimer);
        div.addEventListener("pointerup", endTimer);
        div.addEventListener("pointerleave", endTimer);

        box.appendChild(div);
      }
    });
    if (!primeiraCarga) mostrarNotificacao();
    primeiraCarga = false;
    box.scrollTop = box.scrollHeight;
  });
}

/* ENTRAR NA CALL: registra participante e inicia captura local */
window.entrarNaCall = async () => {
  const telaCall = byId("telaCall");
  if (telaCall) telaCall.classList.add("active");
  await updateDoc(doc(db, "call", "global"), { participantes: arrayUnion(user.nome) }).catch(()=>{});
  try {
    streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
    addVideoRemoto(meuPeer.id, streamLocal);
    const snap = await getDocs(collection(db, "call"));
    const p = snap.docs[0]?.data()?.participantes || [];
    p.forEach(pessoa => {
      if (pessoa !== user.nome) {
        const id = pessoa.replace(/\s+/g, '_').toLowerCase();
        const call = meuPeer.call(id, streamLocal);
        call.on('stream', (rs) => addVideoRemoto(id, rs));
      }
    });
  } catch (e) {
    console.error(e);
    alert("Erro ao acessar câmera/áudio. Verifique permissões e se a página está em HTTPS.");
  }
};

/* addVideoRemoto */
window.addVideoRemoto = (peerId, stream) => {
  const grid = byId("callGrid");
  if (!grid) return;
  let card = byId(`card_${peerId}`);
  if (!card) {
    card = document.createElement("div");
    card.className = "video-card";
    card.id = `card_${peerId}`;
    grid.appendChild(card);
  }
  card.innerHTML = "";
  const v = document.createElement("video");
  v.autoplay = true; v.playsinline = true;
  if (peerId === meuPeer.id) { v.muted = true; v.style.transform = "scaleX(-1)"; }
  v.srcObject = stream;
  card.appendChild(v);
};

/* SAIR CHAMADA */
window.sairChamada = async () => {
  if (streamLocal) {
    streamLocal.getTracks().forEach(t => t.stop());
    streamLocal = null;
  }
  await updateDoc(doc(db, "call", "global"), { participantes: arrayRemove(user.nome) }).catch(()=>{});
  location.reload();
};

/* ENVIAR FOTO -> faz upload para Storage e salva URL no Firestore */
window.enviarFoto = async (input) => {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result; // data URL
    try {
      const path = `mensagens_imagens/${Date.now()}_${(file.name || 'img').replace(/\s+/g,'_')}`;
      const ref = storageRef(storage, path);
      await uploadString(ref, base64, 'data_url');
      const url = await getDownloadURL(ref);
      await addDoc(collection(db, "mensagens"), {
        nome: user.nome, fotoUrl: url, replyTo: respondendoA, createdAt: serverTimestamp(), liked: false
      });
      cancelarResposta();
    } catch (err) {
      console.error(err);
      alert("Erro ao enviar imagem");
    } finally {
      input.value = "";
    }
  };
  reader.readAsDataURL(file);
};

/* ENVIAR TEXTO */
window.enviarMsg = async () => {
  const input = byId("msgInput");
  if (!input || !input.value.trim()) return;
  const texto = input.value;
  try {
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto, replyTo: respondendoA, createdAt: serverTimestamp(), liked: false });
    input.value = "";
    cancelarResposta();
    updateDoc(doc(db, "usuarios_online", user.nome), { digitando: false }).catch(()=>{});
  } catch (err) {
    console.error(err);
    alert("Erro ao enviar mensagem");
  }
};

/* EXPANDIR / FECHAR FOTO */
window.expandirFoto = (src) => { byId("imgExpandida").src = src; byId("fullView").style.display = "flex"; };
window.fecharFoto = () => byId("fullView").style.display = "none";
window.baixarFoto = () => { const link = document.createElement("a"); link.href = byId("imgExpandida").src; link.download = "imagem_chat.png"; link.click(); };

/* RESPONDER / CANCELAR */
function prepararResposta(nome, texto) {
  respondendoA = { nome, texto };
  const p = byId("replyPreview");
  if (p) {
    p.style.display = "block";
    p.innerHTML = `Respondendo a <b>${escapeHtml(nome)}</b>: ${escapeHtml(texto)} <button onclick="cancelarResposta()">✕</button>`;
  }
}
window.cancelarResposta = () => {
  respondendoA = null;
  const p = byId("replyPreview");
  if (p) p.style.display = "none";
};

/* GRAVADOR ÁUDIO -> grava, faz upload e salva URL */
function configurarGravador(){
  const btn = byId("btnAudio");
  if (!btn) return;
  const iniciar = async (e) => {
    e.preventDefault();
    if (gravando) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (ev) => audioChunks.push(ev.data);
      mediaRecorder.onstop = async () => {
        if (audioChunks.length > 0) {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = async () => {
            try {
              const base64 = reader.result;
              const path = `mensagens_audios/${Date.now()}.webm`;
              const ref = storageRef(storage, path);
              await uploadString(ref, base64, 'data_url');
              const url = await getDownloadURL(ref);
              await addDoc(collection(db, "mensagens"), {
                nome: user.nome, audioUrl: url, replyTo: respondendoA, createdAt: serverTimestamp(), liked: false
              });
              cancelarResposta();
            } catch (err) {
              console.error(err);
            }
          };
        }
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      gravando = true;
      btn.classList.add("recording");
    } catch (err) {
      console.error(err);
      alert("Ative o microfone e permita acesso.");
    }
  };
  const parar = () => {
    if (gravando && mediaRecorder) {
      mediaRecorder.stop();
      gravando = false;
      btn.classList.remove("recording");
    }
  };
  btn.addEventListener("pointerdown", iniciar);
  btn.addEventListener("pointerup", parar);
  btn.addEventListener("pointerleave", parar);
}

/* MINIMIZAR/MAXIMIZAR CALL */
window.minimizarCall = () => { byId("telaCall")?.classList.remove("active"); byId("btnRetornarCall").style.display = "block"; };
window.maximizarCall = () => { byId("telaCall")?.classList.add("active"); byId("btnRetornarCall").style.display = "none"; };

/* ESCUTAR CALL: atualiza aviso e botão retornar */
function escutarCall() {
  onSnapshot(doc(db, "call", "global"), (d) => {
    const p = d.data()?.participantes || [];
    const aviso = byId("avisoChatCall");
    const btnRet = byId("btnRetornarCall");
    if (aviso) {
      if (p.length > 0) aviso.innerHTML = `<div class="aviso-bubble" onclick="maximizarCall()">Chamada em curso: ${escapeHtml(p.join(", "))}</div>`;
      else aviso.innerHTML = "";
    }
    if (btnRet) {
      const telaCall = byId("telaCall");
      btnRet.style.display = (p.length > 0 && telaCall && !telaCall.classList.contains("active")) ? "block" : "none";
    }
  });
}

/* MENU MENSAGEM (abrir/fechar/apagar) */
window.abrirMenuMsg = (id, nome) => { msgSelecionadaId = id; msgSelecionadaNome = nome; const m = byId("menuMsg"); if (m) m.style.display = "flex"; };
window.fecharMenuMsg = () => { const m = byId("menuMsg"); if (m) m.style.display = "none"; };
window.confirmarApagar = async () => {
  if (!msgSelecionadaId) return fecharMenuMsg();
  if (msgSelecionadaNome === user.nome) {
    await deleteDoc(doc(db, "mensagens", msgSelecionadaId)).catch(()=>{});
  } else {
    msgsApagadasLocal.push(msgSelecionadaId);
    localStorage.setItem("msgs_ocultas", JSON.stringify(msgsApagadasLocal));
  }
  fecharMenuMsg();
};

/* SALVAR PERFIL */
window.salvarPerfil = () => {
  const editNome = byId("editNome");
  const editBio = byId("editBio");
  if (editNome?.value) {
    user.nome = editNome.value.trim();
    user.bio = editBio?.value || "";
    localStorage.setItem("user_completo", JSON.stringify(user));
    alert("Salvo! ✨");
    fecharPerfil();
    // atualizar usuarios_online doc (novo nome)
    setDoc(doc(db, "usuarios_online", user.nome), { nome: user.nome, lastSeen: serverTimestamp() }).catch(()=>{});
  }
};
window.abrirPerfil = () => { const p = byId("painelPerfil"); if (p) p.style.display = "flex"; };
window.fecharPerfil = () => { const p = byId("painelPerfil"); if (p) p.style.display = "none"; };

window.fechar = () => { side?.classList.remove("open"); if (btnFlutuante) btnFlutuante.style.display = "flex"; };

/* NOTIFICAÇÃO */
function mostrarNotificacao() {
  const note = byId("notificacaoChat");
  if (note) { note.classList.add("show"); setTimeout(() => note.classList.remove("show"), 3000); }
}

/* DIGITANDO (debounce) e @mentions */
let typingTimer;
window.aoDigitar = (input) => {
  checarAt(input);
  updateDoc(doc(db, "usuarios_online", user.nome), { digitando: true }).catch(()=>{});
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    updateDoc(doc(db, "usuarios_online", user.nome), { digitando: false }).catch(()=>{});
  }, 1200);
};

window.checarAt = (input) => {
  const box = byId("atList");
  if (!box) return;
  const words = input.value.split(/\s+/);
  const lastWord = words[words.length - 1] || "";
  if (lastWord.startsWith("@")) {
    const busca = lastWord.slice(1).toLowerCase();
    const matches = listaUsuarios.filter(u => u.toLowerCase().startsWith(busca) && u !== user.nome);
    box.innerHTML = matches.map(u => `<div class="at-item" onclick="selecionarAt('${escapeHtml(u)}')">${escapeHtml(u)}</div>`).join("");
    box.style.display = matches.length ? "block" : "none";
  } else {
    box.style.display = "none";
  }
};

window.selecionarAt = (nome) => {
  const input = byId("msgInput");
  if (!input) return;
  const palavras = input.value.split(/\s+/);
  palavras.pop();
  input.value = (palavras.length ? palavras.join(" ") + " " : "") + "@" + nome + " ";
  fecharAtList();
  input.focus();
};
window.fecharAtList = () => { const b = byId("atList"); if (b) b.style.display = "none"; };

/* TROCAR CAMERA */
window.toggleCam = async () => {
  currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
  try {
    if (streamLocal) streamLocal.getTracks().forEach(t => t.stop());
    streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
    addVideoRemoto(meuPeer.id, streamLocal);
  } catch (err) {
    console.error(err);
    alert("Erro ao alternar câmera");
  }
};

/* ALTERAR VOZ (simples filtro) */
window.alterarVoz = async (tipo) => {
  if (!streamLocal) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(streamLocal);
    const dest = audioCtx.createMediaStreamDestination();

    if (voiceFilter) voiceFilter.disconnect();
    voiceFilter = audioCtx.createBiquadFilter();

    if (tipo === "fino") { voiceFilter.type = "highpass"; voiceFilter.frequency.value = 1500; }
    else if (tipo === "grosso") { voiceFilter.type = "lowpass"; voiceFilter.frequency.value = 400; }
    else if (tipo === "robo") { voiceFilter.type = "peaking"; voiceFilter.frequency.value = 800; voiceFilter.Q.value = 20; }
    else if (tipo === "eco") {
      const delay = audioCtx.createDelay(); delay.delayTime.value = 0.3;
      source.connect(delay); delay.connect(dest);
    }

    if (tipo !== "normal" && tipo !== "eco") {
      source.connect(voiceFilter);
      voiceFilter.connect(dest);
    } else if (tipo === "normal") {
      source.connect(dest);
    }

    const newAudioTrack = dest.stream.getAudioTracks()[0];
    const oldAudioTrack = streamLocal.getAudioTracks()[0];
    if (oldAudioTrack && newAudioTrack && streamLocal.removeTrack) {
      try {
        streamLocal.removeTrack(oldAudioTrack);
        streamLocal.addTrack(newAudioTrack);
      } catch (err) {
        console.warn("Não foi possível substituir track localmente", err);
      }
    }
  } catch (err) {
    console.error(err);
  }
};

/* MUTE */
window.toggleMute = () => {
  audioMuted = !audioMuted;
  if (streamLocal && streamLocal.getAudioTracks()[0]) streamLocal.getAudioTracks()[0].enabled = !audioMuted;
  const btn = byId("btnMute");
  if (btn) btn.innerText = audioMuted ? "🎙️❌" : "🎙️";
};

/* atualizarStatusOnline em background */
async function atualizarStatusOnline() {
  if (user?.nome) {
    await setDoc(doc(db, "usuarios_online", user.nome), {
      nome: user.nome,
      lastSeen: serverTimestamp()
    }, {merge: true}).catch(()=>{});
  }
}
setInterval(atualizarStatusOnline, 60000);
