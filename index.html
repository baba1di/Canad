<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simples</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #fdfdfd; color: #333; }
        .chat-wrapper { max-width: 400px; margin: 20px auto; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #chat-header { background-color: #4a90e2; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #mensagens { height: 300px; overflow-y: auto; padding: 15px; background: #fff; border-bottom: 1px solid #eee; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #f0f0f0; }
        .input-area { display: flex; padding: 10px; background: #f9f9f9; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-left: 5px; padding: 8px 15px; background-color: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <div id="chat-header">Chat Público</div>
        <div id="mensagens"></div>
        <div class="input-area">
            <input type="text" id="input-msg" placeholder="Digite uma mensagem...">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <script>
        let mensagens = [];

        function enviarMensagem() {
            const input = document.getElementById("input-msg");
            if (input.value.trim() === "") return;
            
            mensagens.push({ texto: input.value, timestamp: new Date().toLocaleTimeString() });
            input.value = "";
            renderizarMensagens();
        }

        function renderizarMensagens() {
            const container = document.getElementById("mensagens");
            container.innerHTML = mensagens.map(m => `<div class="msg">${m.texto} <small style="display:block; color:#888;">${m.timestamp}</small></div>`).join("");
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
