<!DOCTYPE html><html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Social</title><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script><style>
body{margin:0;background:#05070a;color:#fff;font-family:sans-serif}
.screen{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none}
.screen.active{opacity:1;pointer-events:all}
.box{background:#111;padding:20px;border-radius:15px;width:90%;max-width:400px}
input,select,textarea{width:100%;margin:5px 0;padding:10px;background:#222;border:none;color:#fff;border-radius:8px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;background:#00f2ff;color:#000}
.menu{position:fixed;top:20px;right:20px}
.panel{position:fixed;right:-100%;top:0;width:100%;height:100%;background:#000;transition:.3s;padding:20px;display:flex;flex-direction:column}
.panel.open{right:0}
.msg{background:#111;margin:5px;padding:10px;border-radius:10px}
.chat-bar{display:flex;gap:5px}
.chat-bar input{flex:1}
</style></head><body><div id="scrReg" class="screen active">
<div class="box">
<h3>Cadastro</h3>
<form id="formReg">
<input id="n" placeholder="Nome" required>
<input type="date" id="d" required>
<select id="g"><option>Gênero</option></select>
<textarea id="b" placeholder="Bio"></textarea>
<button>Entrar</button>
</form>
</div>
</div><div id="scrApp" class="screen">
<div class="menu">
<button onclick="openChat()">💬</button>
<button onclick="openPerfil()">👤</button>
</div><h2 id="wlc"></h2><div id="side" class="panel">
<button onclick="fechar()">Voltar</button>
<div id="content"></div>
</div>
</div><script>
const firebaseConfig={
apiKey:"AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
databaseURL:"https://chat-app-c974a-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let user={},chatRef=null;

const saved=localStorage.getItem("user");
if(saved){
user=JSON.parse(saved);
start();
}

formReg.onsubmit=e=>{
e.preventDefault();

let birth=new Date(d.value);
let age=new Date().getFullYear()-birth.getFullYear();

if(age<10){alert("mínimo 10 anos");return;}

user={nome:n.value,bio:b.value};
localStorage.setItem("user",JSON.stringify(user));
start();
};

function start(){
scrReg.classList.remove("active");
scrApp.classList.add("active");
wlc.innerText="Olá "+user.nome;
}

function openChat(){

if(chatRef) chatRef.off();

content.innerHTML=`
<h2>Chat</h2>
<div id="msgs"></div>
<div class="chat-bar">
<input id="msg">
<button onclick="send()">Enviar</button>
</div>`;

side.classList.add("open");

chatRef=db.ref("msgs").limitToLast(50);

chatRef.on("child_added",s=>{
let d=s.val();
let div=document.createElement("div");
div.className="msg";
div.innerHTML="<b>"+d.u+"</b><br>"+d.t;
msgs.appendChild(div);
msgs.scrollTop=msgs.scrollHeight;
});
}

function send(){
let input=document.getElementById("msg");
if(!input.value.trim())return;

db.ref("msgs").push({u:user.nome,t:input.value});
input.value="";
}

function openPerfil(){
content.innerHTML="<h2>"+user.nome+"</h2><p>"+user.bio+"</p>";
side.classList.add("open");
}

function fechar(){
side.classList.remove("open");
if(chatRef) chatRef.off();
}
</script></body>
</html>
