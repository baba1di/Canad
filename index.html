<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Real ✨</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, onSnapshot,
    query, orderBy, deleteDoc, doc, getDocs, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAjH1kVPCZHqZRzu9AszDKiD9csdEmSz_c",
    authDomain: "chat-app-c974a.firebaseapp.com",
    projectId: "chat-app-c974a",
    storageBucket: "chat-app-c974a.appspot.com",
    messagingSenderId: "753329556773",
    appId: "1:753329556773:web:4511da13d5355efca81ecc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo"));
let streamLocal = null;
let micAtivo = true;

window.onload = () => {
    if(user && user.nome) startApp();
    else scrReg.classList.add("active");

    formReg.onsubmit = (e) => {
        e.preventDefault();
        user = { nome: n.value, data: regData.value, genero: regGen.value, bio: regBio.value };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
};

function startApp() {
    scrReg.classList.remove("active");
    scrApp.classList.add("active");
    setDoc(doc(db, "call", "global"), { participantes: [] }, { merge: true });
}

window.abrirChat = () => {
    btnFlutuante.style.display = "none";
    sideContent.innerHTML = `
    <div class="chat-header">
        <button class="voltar-btn" onclick="fechar()">❮</button>
        <div class="header-center">Chat Real ✨</div>
        <div style="display:flex; gap:12px; align-items:center">
            <button class="icon-btn" onclick="iniciarChamada()">📞</button>
            <button class="icon-btn" onclick="abrirPerfil()">👤</button>
        </div>
    </div>
    <div class="chat-wrapper">
        <div id="callBanner"></div>
        <div id="chatMsgs"></div>
        <div class="chat-bar">
            <input id="msgInput" placeholder="Mande a boa...">
            <button class="send-btn" onclick="enviarMsg()">➤</button>
        </div>
    </div>
    
    <div id="painelPerfil" class="perfil-overlay">
        <div class="perfil-box">
            <div class="perfil-header">
                <h3>Meu Perfil</h3>
                <button onclick="fecharPerfil()">✕</button>
            </div>
            <div class="avatar-grande">👤</div>
            <div class="p-info">
                <div class="p-item"><span>NOME</span> <b>${user.nome}</b></div>
                <div class="p-item"><span>BIO</span> <b>${user.bio || 'Sem bio'}</b></div>
                <div class="p-item"><span>GÊNERO</span> <b>${user.genero}</b></div>
            </div>
        </div>
    </div>

    <div id="telaCall" class="call-overlay">
        <div class="call-container">
            <div class="video-container">
                <video id="localVideo" autoplay playsinline muted></video>
                <div id="camOffMsg">📷 Câmera Desligada</div>
            </div>
            <p id="countCall" class="call-status">0 pessoas na call</p>
            <div class="controles-call">
                <button id="btnCam" class="btn-ctrl" onclick="toggleCam()">🎥</button>
                <button id="btnMic" class="btn-ctrl" onclick="toggleMic()">🎤</button>
                <button class="btn-ctrl btn-hangup" onclick="sairChamada()">📞</button>
            </div>
        </div>
    </div>`;
    side.classList.add("open");
    escutarMensagens();
    escutarCall();
};

window.toggleCam = async () => {
    const videoTag = document.getElementById("localVideo");
    const msgOff = document.getElementById("camOffMsg");
    const btn = document.getElementById("btnCam");
    if (!streamLocal) {
        try {
            streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
            videoTag.srcObject = streamLocal;
            videoTag.style.display = "block";
            msgOff.style.display = "none";
            btn.classList.add("active-btn");
        } catch (err) { alert("Permita o acesso à câmera."); }
    } else {
        streamLocal.getTracks().forEach(track => track.stop());
        streamLocal = null;
        videoTag.style.display = "none";
        msgOff.style.display = "block";
        btn.classList.remove("active-btn");
    }
};

window.toggleMic = () => {
    micAtivo = !micAtivo;
    if(streamLocal) streamLocal.getAudioTracks().forEach(t => t.enabled = micAtivo);
    document.getElementById("btnMic").style.background = micAtivo ? "" : "#ff4444";
};

window.iniciarChamada = async () => {
    await addDoc(collection(db, "mensagens"), {
        nome: user.nome,
        texto: "está ligando para a gente, vocês querem entrar?",
        tipo: "call_invite",
        createdAt: serverTimestamp()
    });
    entrarNaCall();
};

function escutarCall() {
    onSnapshot(doc(db, "call", "global"), (d) => {
        const p = d.data()?.participantes || [];
        const banner = document.getElementById("callBanner");
        if(banner) {
            banner.innerHTML = p.length > 0 ? 
            `<div class="call-banner-card">
                <span>📞 Call em curso (${p.length})</span>
                <button onclick="entrarNaCall()">ENTRAR</button>
            </div>` : "";
        }
        if(document.getElementById("countCall"))
            document.getElementById("countCall").innerText = `${p.length} pessoas na chamada`;
    });
}

window.entrarNaCall = async () => {
    document.getElementById("telaCall").classList.add("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayUnion(user.nome) });
};

window.sairChamada = async () => {
    if(streamLocal) { streamLocal.getTracks().forEach(track => track.stop()); streamLocal = null; }
    document.getElementById("telaCall").classList.remove("active");
    await updateDoc(doc(db, "call", "global"), { participantes: arrayRemove(user.nome) });
};

function escutarMensagens() {
    const box = document.getElementById("chatMsgs");
    onSnapshot(query(collection(db,"mensagens"),orderBy("createdAt", "asc")), snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const id = docSnap.id;
            const div = document.createElement("div");
            div.className = d.nome === user.nome ? "msg me" : "msg";
            let likes = d.liked ? `<span class="heart-pop">❤️</span>` : "";

            if(d.tipo === "call_invite") {
                div.innerHTML = `<div class="call-msg-box">
                    <b>${d.nome}</b> está ligando...<br>
                    <button class="call-join-btn" onclick="entrarNaCall()">ENTRAR NA CHAMADA</button>
                </div>`;
            } else {
                div.innerHTML = `<span class="sender">${d.nome}</span><p>${d.texto}</p>${likes}`;
            }
            div.ondblclick = () => updateDoc(doc(db, "mensagens", id), { liked: !d.liked });
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.abrirPerfil = () => document.getElementById("painelPerfil").classList.add("active");
window.fecharPerfil = () => document.getElementById("painelPerfil").classList.remove("active");
window.enviarMsg = async () => {
    const input = document.getElementById("msgInput");
    if(!input.value.trim()) return;
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: input.value, createdAt: serverTimestamp(), liked: false });
    input.value = "";
};
window.fechar = () => { side.classList.remove("open"); btnFlutuante.style.display = "flex"; };
</script>

<style>
:root { --main: #00f2ff; --bg: #0a0a0a; --box: #151515; --me: #00f2ff; }
body { margin:0; background: var(--bg); color:#fff; font-family: 'Segoe UI', Roboto, sans-serif; height:100vh; overflow:hidden; }

/* CADASTRO */
.screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition: 0.4s; }
.screen.active { opacity:1; pointer-events:all; }
.box { background: var(--box); padding:30px; border-radius:24px; width:85%; border:1px solid #222; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.box h2 { color: var(--main); margin-bottom: 20px; }
input, select, textarea { width:100%; padding:14px; margin:8px 0; background:#000; border:1px solid #333; border-radius:12px; color:#fff; font-size: 15px; }

/* HEADER */
.chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111; border-bottom: 1px solid #222; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.header-center { font-weight: bold; color: var(--main); font-size: 18px; }
.icon-btn { background: #222; border: none; width: 42px; height: 42px; border-radius: 50%; color: var(--main); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
.icon-btn:active { transform: scale(0.9); background: var(--main); color: #000; }
.voltar-btn { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; }

/* CHAT */
.chat-wrapper { display: flex; flex-direction: column; height: calc(100% - 70px); }
#chatMsgs { flex:1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { position: relative; background: #1a1a1a; padding: 12px 16px; border-radius: 18px 18px 18px 4px; max-width: 80%; align-self: flex-start; border: 1px solid #222; animation: pop 0.3s ease-out; }
.msg.me { background: var(--me); color: #000; align-self: flex-end; border-radius: 18px 18px 4px 18px; border: none; font-weight: 500; }
.sender { font-size: 11px; font-weight: bold; opacity: 0.6; display: block; margin-bottom: 4px; }
.heart-pop { position: absolute; bottom: -8px; right: -5px; background: #000; border-radius: 50%; padding: 3px 5px; font-size: 14px; border: 1px solid #333; animation: heart 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.49); }

/* CALL BANNER */
.call-banner-card { background: var(--main); color: #000; padding: 12px 20px; margin: 10px 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; box-shadow: 0 5px 15px rgba(0,242,255,0.3); }
.call-banner-card button { background: #000; color: #fff; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

/* TELA CALL */
.call-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
.call-overlay.active { display: flex; }
.video-container { width: 85%; height: 60vh; background: #111; border-radius: 30px; border: 2px solid var(--main); overflow: hidden; position: relative; }
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
#camOffMsg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #444; font-weight: bold; }
.call-status { margin: 20px 0; color: var(--main); font-weight: bold; }
.controles-call { display: flex; gap: 20px; }
.btn-ctrl { width: 65px; height: 65px; border-radius: 50%; border: none; background: #222; color: #fff; font-size: 24px; cursor: pointer; transition: 0.3s; }
.active-btn { background: var(--main) !important; color: #000 !important; }
.btn-hangup { background: #ff4444 !important; }

/* PERFIL */
.perfil-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1100; display: none; align-items: center; justify-content: center; }
.perfil-overlay.active { display: flex; }
.perfil-box { width: 85%; background: var(--box); border-radius: 30px; padding: 25px; border: 1px solid var(--main); }
.perfil-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.perfil-header button { background: none; border: none; color: #fff; font-size: 24px; }
.avatar-grande { font-size: 60px; background: #222; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 2px solid var(--main); }
.p-item { background: #000; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #222; }
.p-item span { font-size: 10px; color: var(--main); display: block; margin-bottom: 5px; }

/* BARRA DE MENSAGEM */
.chat-bar { padding: 15px; background: #111; display: flex; gap: 10px; align-items: center; }
.chat-bar input { margin: 0; border-radius: 25px; border: 1px solid #333; }
.send-btn { background: var(--main); border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 20px; cursor: pointer; }

/* MENU FLUTUANTE */
.menu button { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; background: var(--main); border: none; position: fixed; bottom: 30px; right: 25px; box-shadow: 0 0 20px rgba(0,242,255,0.4); }
.panel { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 500; }
.panel.open { transform: translateX(0); }

@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes heart { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
</style>
</head>
<body>
<div id="scrReg" class="screen"><div class="box">
    <h2>Bem-vindo! ✨</h2>
    <form id="formReg">
        <input id="n" placeholder="Como quer ser chamado?" required>
        <input type="date" id="regData" required>
        <select id="regGen"><option>Masculino</option><option>Feminino</option><option>Outro</option></select>
        <textarea id="regBio" placeholder="Sua bio..."></textarea>
        <button style="background:var(--main); padding:14px; border-radius:12px; border:none; width:100%; font-weight:bold; color:#000; margin-top:10px">ENTRAR NO CHAT</button>
    </form>
</div></div>
<div id="scrApp" class="screen">
    <div id="btnFlutuante" class="menu"><button onclick="abrirChat()">💬</button></div>
    <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
</div>
</body>
</html>
