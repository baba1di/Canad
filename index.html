<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Social App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <div class="glow-container">
        <div class="ball"></div>
        <div class="ball"></div>
    </div>

    <div id="registerScreen" class="full-screen active">
        <main class="main-card glass-card">
            <div class="card-header">
                <div class="icon-box gradient-1">
                    <i data-lucide="user-plus"></i>
                </div>
                <h1>Crie sua Conta</h1>
                <p>Apenas para maiores de 10 anos.</p>
            </div>

            <form id="profileForm">
                <div class="grid-inputs">
                    <div class="input-wrapper" style="--delay: 0.1s">
                        <i data-lucide="user"></i>
                        <input type="text" id="regNome" placeholder=" " required>
                        <label>Nome Completo</label>
                    </div>
                    <div class="input-wrapper" style="--delay: 0.2s">
                        <i data-lucide="calendar"></i>
                        <input type="date" id="regData" required>
                        <label class="fixed">Data de Nascimento</label>
                    </div>
                    <div class="input-wrapper" style="--delay: 0.3s">
                        <i data-lucide="venn-diagram"></i>
                        <select id="regGenero" required>
                            <option value="" disabled selected>Gênero</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="input-wrapper full-width" style="--delay: 0.4s">
                        <i data-lucide="align-left"></i>
                        <textarea id="regBio" placeholder=" " rows="3" required></textarea>
                        <label>Sua Bio...</label>
                    </div>
                </div>
                <button type="submit" class="btn-shine" id="btnRegister">
                    <span>Entrar no App</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>
        </main>
    </div>

    <div id="appScreen" class="full-screen">
        <div class="actions-bar">
            <button class="action-btn" id="openProfile"><i data-lucide="settings"></i></button>
            <button class="action-btn" id="openChat">
                <i data-lucide="message-square"></i>
                <span class="notification-badge"></span>
            </button>
        </div>
        <div class="app-content">
            <h1 class="welcome-text">Bem-vindo ao Futuro.</h1>
            <p>Clique nos ícones ao lado para navegar.</p>
        </div>
        <div id="sidePanel" class="side-panel glass-card">
            <button class="close-panel" id="closePanel">&times;</button>
            <div id="panelContent"></div>
        </div>
    </div>

    <template id="profileTemplate">
        <div class="panel-header"><h2>Seu Perfil</h2></div>
        <div class="profile-details">
            <p><strong>Nome:</strong> <span id="pNome"></span></p>
            <p><strong>Nascimento:</strong> <span id="pData"></span></p>
            <p><strong>Gênero:</strong> <span id="pGenero"></span></p>
            <div class="bio-box"><strong>Bio:</strong> <p id="pBio"></p></div>
        </div>
    </template>

    <template id="chatTemplate">
        <div class="panel-header"><h2>Chat Global</h2></div>
        <div class="chat-wrapper">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Sua mensagem...">
                <button id="sendMsg"><i data-lucide="send"></i></button>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
