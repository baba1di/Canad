<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vibe Premium Ultra ✨</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<!-- Adicionado FontAwesome para o ícone de verificado -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* RESET E NAVEGAÇÃO ENTRE APPS */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
    
    #app-switcher {
        display: flex; background: #111; border-bottom: 1px solid #222;
        position: fixed; top: 0; left: 0; width: 100%; height: 50px; z-index: 10000;
        justify-content: space-around; align-items: center;
    }
    .switch-btn {
        background: none; border: none; color: #666; font-weight: bold; font-size: 12px;
        cursor: pointer; padding: 10px; transition: 0.3s;
    }
    .switch-btn.active { color: #00f2ff; border-bottom: 2px solid #00f2ff; }

    .main-wrapper { margin-top: 50px; height: calc(100vh - 50px); position: relative; }
    .app-page { position: absolute; inset: 0; display: none; }
    .app-page.active { display: block; }

    /* --- ESTILOS DO CHAT --- */
    :root { --main: #00f2ff; --bg: #000; }
    .chat-header { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 15px; background: #111; border-bottom: 1px solid #222;
        position: relative; z-index: 1001; 
    }
    .icon-btn { background: #222; border: none; width: 45px; height: 45px; border-radius: 50%; color: var(--main); font-size: 20px; cursor: pointer; }
    .chat-wrapper { display: flex; flex-direction: column; height: calc(100% - 75px); position: relative; }
    #chatMsgs { flex:1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;}
    .msg { background: #1a1a1a; padding: 10px 15px; border-radius: 18px; max-width: 80%; align-self: flex-start; position: relative; border: 1px solid #222; display: flex; flex-direction: column; }
    .msg.me { background: var(--main); color: #000; align-self: flex-end; border: none; }
    
    .msg-top { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
    .user-icon-msg { cursor: pointer; font-size: 14px; background: #333; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; position: relative; }

    /* Coração e Privado */
    .heart-pop { position: absolute; bottom: -8px; right: -5px; background: #000; border-radius: 50%; padding: 2px 5px; border: 1px solid #333; font-size: 14px; }
    .private-msg { border: 1px dashed var(--main) !important; background: rgba(0, 242, 255, 0.05) !important; }
    .lock-icon { font-size: 9px; background: #222; color: var(--main); padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: bold; }
    .at-box { position: absolute; bottom: 70px; left: 10px; background: #111; border: 1px solid var(--main); border-radius: 12px; width: 200px; display: none; z-index: 10002; max-height: 150px; overflow-y: auto; }
    .at-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; color: var(--main); }

    .chat-bar { padding: 10px; background: #111; display: flex; gap: 10px; align-items: center; }
    .chat-bar input { flex:1; background:#000; border:1px solid #333; padding:12px; border-radius:20px; color:#fff; outline:none; }
    .send-btn { background: var(--main); border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .menu-btn-float button { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; background: var(--main); border: none; position: fixed; bottom: 30px; right: 25px; box-shadow: 0 0 15px var(--main); cursor: pointer; z-index: 999;}
    .panel { position: fixed; inset: 0; background: #000; transform: translateX(100%); transition: 0.3s; z-index: 11000; }
    .panel.open { transform: translateX(0); }
    .screen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; opacity:0; pointer-events:none; z-index: 20000; background: rgba(0,0,0,0.9); transition: 0.3s; }
    .screen.active { opacity:1; pointer-events:all; }
    .save-btn { background: var(--main); color: #000; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    input, select, textarea { width: 100%; padding: 15px; margin-top: 10px; background: #000; border: 1px solid #222; border-radius: 12px; color: #fff; }

    /* Estilo do Selo de Verificado */
    .badge-verificado { color: #00f2ff; font-size: 10px; margin-left: 2px; }
    /* Verificado no ícone redondo */
    .mini-verif { position: absolute; bottom: -4px; right: -4px; font-size: 9px; color: #00f2ff; background: #000; border-radius: 50%; }

    /* --- ESTILOS CALL --- */
    .call-overlay { position: fixed; inset: 0; background: #000; z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    .call-overlay.active { display: flex; }
    .call-grid { display: grid; gap: 12px; width: 95%; height: 75vh; grid-template-columns: 1fr 1fr; align-content: center; }
    .video-card { background: #111; border-radius: 20px; overflow: hidden; border: 2px solid #222; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.5); height: 100%; }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    /* Efeito espelho no meu próprio vídeo para não parecer estranho */
    .meu-video { transform: scaleX(-1); }
    .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 8px; font-size: 12px; color: #00f2ff; backdrop-filter: blur(4px); }
    
    .controles-call { display: flex; gap: 20px; margin-top: 30px; }
    .btn-hangup { background: #ff4444 !important; color: #fff !important; width: 60px !important; height: 60px !important; }

    /* Stats de Seguir */
    .avatar-grande { width: 80px; height: 80px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 15px; border: 2px solid var(--main); position: relative; }
    .stats-container { display: flex; justify-content: space-around; margin: 15px 0; border-top: 1px solid #222; padding-top: 10px; }
    .stat-item { text-align: center; }
    .stat-val { display: block; font-weight: bold; color: var(--main); font-size: 18px; }
    .stat-label { font-size: 10px; opacity: 0.6; text-transform: uppercase; }
    .btn-seguir { background: #fff; color: #000; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-seguir.seguindo { background: #333; color: #fff; }

    /* --- ESTILOS DA MÚSICA --- */
    #pageMusic { background: #0b0e14; overflow-y: auto; height: 100%; }
    .music-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; background: rgba(11, 14, 20, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #1e293b; }
    .search-bar-music { display: flex; align-items: center; background: #1a1f29; border-radius: 12px; padding: 5px 15px; flex: 1; margin-right: 15px; border: 1px solid transparent; }
    .search-bar-music input { background: transparent; border: none; padding: 10px; color: white; flex: 1; outline: none; }
    #music-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding-bottom: 120px; }
    .card { background: #1a1f29; padding: 12px; border-radius: 16px; transition: 0.3s; cursor: pointer; border: 1px solid transparent; position: relative; }
    .card img { width: 100%; border-radius: 12px; margin-bottom: 10px; }
    .music-footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: #0b0e14; border-top: 1px solid #1e293b; padding: 0 20px; display: flex; align-items: center; z-index: 9000; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc, limit, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqgPPmWG6cM3xpFLtOBjQJ8PmAVV7YgaY",
  authDomain: "chatt-4bfcd.firebaseapp.com",
  databaseURL: "https://chatt-4bfcd-default-rtdb.firebaseio.com",
  projectId: "chatt-4bfcd",
  storageBucket: "chatt-4bfcd.firebasestorage.app",
  messagingSenderId: "1056039006721",
  appId: "1:1056039006721:web:7df8605c6dc1b77b460600"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let user = JSON.parse(localStorage.getItem("user_completo")) || {};
let favorites = JSON.parse(localStorage.getItem("meus_favs")) || [];
let meuPeer = null;
let streamLocal = null;
let listaUsuarios = [];
let databaseUsuarios = {}; // Armazena dados dos usuários para checar verificado

const byId = (id) => document.getElementById(id);
const escapeHtml = (str = "") => String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]);

// FUNÇÃO PARA FORMATAR NÚMEROS (1000 -> 1k)
function formatarNumero(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return num;
}

window.switchApp = (appId, btn) => {
    document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
    byId(appId).classList.add('active');
    btn.classList.add('active');
};

window.addEventListener("DOMContentLoaded", () => {
    if (user && user.nome) startApp();
    else byId("scrReg").classList.add("active");

    byId("formReg").onsubmit = async (e) => {
        e.preventDefault();
        const nome = byId("n").value.trim();
        const reservados = ["ka", "isaac"];
        if (reservados.includes(nome.toLowerCase())) {
            alert("Erro: O nome '" + nome + "' é reservado!");
            return;
        }

        const userRef = doc(db, "usuarios_online", nome);
        const docSnap = await getDoc(userRef);
        if (docSnap.exists() && user.nome !== nome) {
            alert("Este nome já está em uso. Escolha outro!");
            return;
        }

        user = { nome, data: byId("regData").value, genero: byId("regGen").value, bio: byId("regBio").value, seguidores: [], seguindo: [] };
        localStorage.setItem("user_completo", JSON.stringify(user));
        startApp();
    };
});

async function startApp() {
    byId("scrReg").classList.remove("active");
    const peerId = (user.nome || "anon").replace(/\s+/g, '_').toLowerCase();
    meuPeer = new Peer(peerId);

    meuPeer.on('call', (call) => {
        call.answer(streamLocal);
        call.on('stream', (remoteStream) => addVideoRemoto(call.peer, remoteStream));
    });

    await setDoc(doc(db, "usuarios_online", user.nome), { 
        nome: user.nome, lastSeen: serverTimestamp(), bio: user.bio || "",
        seguidores: user.seguidores || [], seguindo: user.seguindo || []
    }, { merge: true });

    onSnapshot(collection(db, "usuarios_online"), snap => {
        listaUsuarios = [];
        databaseUsuarios = {};
        snap.forEach(d => {
            const data = d.data();
            databaseUsuarios[data.nome] = data;
            if(data.nome) listaUsuarios.push(data.nome);
            if(d.id === user.nome) {
                user.seguidores = data.seguidores || [];
                user.seguindo = data.seguindo || [];
                localStorage.setItem("user_completo", JSON.stringify(user));
            }
        });
    });
}

/* --- CHAT --- */
window.abrirChat = () => {
    byId("btnFlutuante").style.display = "none";
    byId("sideContent").innerHTML = `
        <div class="chat-header">
            <button onclick="fechar()" style="background:none;border:none;color:#fff;font-size:20px">❮</button>
            <div class="header-center">Chat Real ✨</div>
            <div style="display:flex; gap:12px; align-items:center;">
                <button class="icon-btn" onclick="entrarNaCall()">📞</button>
                <button class="icon-btn" onclick="abrirMeuPerfil()">👤</button>
            </div>
        </div>
        <div class="chat-wrapper">
            <div id="chatMsgs"></div>
            <div id="atList" class="at-box"></div>
            <div class="chat-bar">
                <input id="msgInput" placeholder="Manda a boa..." oninput="checarAt(this)" onkeypress="if(event.key === 'Enter') enviarMsg()">
                <button class="send-btn" onclick="enviarMsg()">➤</button>
            </div>
        </div>
    `;
    byId("side").classList.add("open");
    escutarMensagens();
};

function escutarMensagens() {
    const box = byId("chatMsgs");
    const q = query(collection(db,"mensagens"), orderBy("createdAt", "asc"), limit(100));
    onSnapshot(q, snap => {
        box.innerHTML = "";
        snap.forEach(docSnap => {
            const d = docSnap.data();
            const texto = d.texto || "";
            if (/<script|<html|<style/gi.test(texto)) return; 

            const mencao = texto.match(/@(\S+)/);
            const destino = mencao ? mencao[1] : null;
            const ehPrivada = destino !== null;
            if (!ehPrivada || d.nome === user.nome || destino === user.nome) {
                const div = document.createElement("div");
                div.className = d.nome === user.nome ? "msg me" : "msg";
                if(ehPrivada) div.classList.add("private-msg");
                
                // LÓGICA DO VERIFICADO (NOMES RESERVADOS OU 1000+ SEGUIDORES)
                const verificadosOficiais = ["Ka", "ISAAC"];
                const userData = databaseUsuarios[d.nome];
                const temMilSeguidores = userData && userData.seguidores && userData.seguidores.length >= 1000;
                
                const iconeVerifSelo = (verificadosOficiais.includes(d.nome) || temMilSeguidores) ? `<i class="fa-solid fa-circle-check badge-verificado"></i>` : "";
                const iconeVerifMini = (verificadosOficiais.includes(d.nome) || temMilSeguidores) ? `<i class="fa-solid fa-circle-check mini-verif"></i>` : "";

                div.innerHTML = `
                    <div class="msg-top">
                        <span class="user-icon-msg" onclick="verPerfilExterno('${escapeHtml(d.nome)}')">👤${iconeVerifMini}</span>
                        <span style="font-size:10px;opacity:0.6">${escapeHtml(d.nome)}${iconeVerifSelo} ${ehPrivada ? '🔒' : ''}</span>
                    </div>
                    <p>${escapeHtml(texto)}</p>
                    ${d.liked ? '<span class="heart-pop">❤️</span>' : ''}
                `;
                div.ondblclick = () => updateDoc(doc(db, "mensagens", docSnap.id), { liked: !d.liked });
                box.appendChild(div);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

window.enviarMsg = async () => {
    const input = byId("msgInput");
    if (!input.value.trim()) return;
    await addDoc(collection(db,"mensagens"), { nome: user.nome, texto: input.value, createdAt: serverTimestamp(), liked: false });
    input.value = "";
    byId("atList").style.display = "none";
};

/* --- PERFIL EXTERNO --- */
window.verPerfilExterno = async (nomeAlvo) => {
    if(nomeAlvo === user.nome) return abrirMeuPerfil();
    const docSnap = await getDoc(doc(db, "usuarios_online", nomeAlvo));
    if (!docSnap.exists()) return;
    const dados = docSnap.data();
    const jaSegue = (dados.seguidores || []).includes(user.nome);

    // Verificado no Perfil Externo
    const verificadosOficiais = ["Ka", "ISAAC"];
    const temMilSeguidores = (dados.seguidores || []).length >= 1000;
    const iconeVerifMini = (verificadosOficiais.includes(nomeAlvo) || temMilSeguidores) ? `<i class="fa-solid fa-circle-check mini-verif"></i>` : "";

    byId("perfilExternoContent").innerHTML = `
        <div class="avatar-grande">👤${iconeVerifMini}</div>
        <h2 style="text-align:center">${escapeHtml(nomeAlvo)}</h2>
        <p style="text-align:center; opacity:0.7">${escapeHtml(dados.bio || "Sem bio...")}</p>
        <div class="stats-container">
            <div class="stat-item"><span class="stat-val">${formatarNumero((dados.seguidores || []).length)}</span><span class="stat-label">Seguidores</span></div>
            <div class="stat-item"><span class="stat-val">${formatarNumero((dados.seguindo || []).length)}</span><span class="stat-label">Seguindo</span></div>
        </div>
        <button class="btn-seguir ${jaSegue ? 'seguindo' : ''}" onclick="toggleSeguir('${nomeAlvo}')">${jaSegue ? 'Seguindo' : 'Seguir'}</button>
    `;
    byId("painelExterno").classList.add("active");
};

window.toggleSeguir = async (nomeAlvo) => {
    const refAlvo = doc(db, "usuarios_online", nomeAlvo);
    const refEu = doc(db, "usuarios_online", user.nome);
    const snap = await getDoc(refAlvo);
    const jaSegue = (snap.data().seguidores || []).includes(user.nome);

    if(jaSegue) {
        await updateDoc(refAlvo, { seguidores: arrayRemove(user.nome) });
        await updateDoc(refEu, { seguindo: arrayRemove(nomeAlvo) });
    } else {
        await updateDoc(refAlvo, { seguidores: arrayUnion(user.nome) });
        await updateDoc(refEu, { seguindo: arrayUnion(nomeAlvo) });
    }
    verPerfilExterno(nomeAlvo);
};

/* --- CALLS (CÂMERA ARRUMADA) --- */
window.entrarNaCall = async () => {
    byId("telaCall").classList.add("active");
    try {
        streamLocal = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        addVideoRemoto(meuPeer.id, streamLocal, true);
        const snap = await getDocs(collection(db, "usuarios_online"));
        snap.forEach(uDoc => {
            if(uDoc.data().nome !== user.nome) {
                const id = uDoc.data().nome.replace(/\s+/g, '_').toLowerCase();
                const call = meuPeer.call(id, streamLocal);
                call?.on('stream', (rs) => addVideoRemoto(id, rs));
            }
        });
    } catch (e) { alert("Permita a câmera para entrar!"); }
};

window.addVideoRemoto = (peerId, stream, isMe = false) => {
    const grid = byId("callGrid");
    let card = byId(`card_${peerId}`);
    if (!card) {
        card = document.createElement("div");
        card.className = "video-card";
        card.id = `card_${peerId}`;
        grid.appendChild(card);
    }
    const v = document.createElement("video");
    v.autoplay = true; v.playsinline = true;
    if(isMe) { v.muted = true; v.className = "meu-video"; }
    v.srcObject = stream;
    card.innerHTML = `<div class="video-label">${isMe ? 'Você' : peerId}</div>`;
    card.appendChild(v);
};

/* --- OUTRAS FUNÇÕES --- */
window.abrirMeuPerfil = () => {
    byId("editNome").value = user.nome; byId("editBio").value = user.bio || "";
    byId("meusSeguidores").textContent = formatarNumero((user.seguidores || []).length);
    byId("meusSeguindo").textContent = formatarNumero((user.seguindo || []).length);
    
    // Verificado no Meu Perfil
    const verificadosOficiais = ["Ka", "ISAAC"];
    const temMilSeguidores = (user.seguidores || []).length >= 1000;
    const iconeVerifMini = (verificadosOficiais.includes(user.nome) || temMilSeguidores) ? `<i class="fa-solid fa-circle-check mini-verif"></i>` : "";
    byId("meuAvatarPerfil").innerHTML = `👤${iconeVerifMini}`;

    byId("painelPerfil").classList.add("active");
};

window.salvarPerfil = async () => {
    user.nome = byId("editNome").value; user.bio = byId("editBio").value;
    localStorage.setItem("user_completo", JSON.stringify(user));
    await updateDoc(doc(db, "usuarios_online", user.nome), { bio: user.bio, nome: user.nome });
    location.reload();
};

window.checarAt = (input) => {
    const box = byId("atList");
    const val = input.value.split(/\s+/).pop();
    if (val.startsWith("@")) {
        const matches = listaUsuarios.filter(u => u.toLowerCase().startsWith(val.slice(1).toLowerCase()) && u !== user.nome);
        box.innerHTML = matches.map(u => `<div class="at-item" onclick="selecionarAt('${u}')">${u}</div>`).join("");
        box.style.display = matches.length ? "block" : "none";
    } else box.style.display = "none";
};

window.selecionarAt = (n) => {
    const i = byId("msgInput");
    const p = i.value.split(/\s+/); p.pop();
    i.value = (p.length ? p.join(" ") + " " : "") + "@" + n + " ";
    byId("atList").style.display = "none"; i.focus();
};

window.sairChamada = () => { location.reload(); };
window.fechar = () => { byId("side").classList.remove("open"); byId("btnFlutuante").style.display = "flex"; };
window.fecharMeuPerfil = () => byId("painelPerfil").classList.remove("active");
window.fecharPerfilExterno = () => byId("painelExterno").classList.remove("active");

window.performSearch = () => {
    const q = byId('music-input').value;
    const s = document.createElement('script');
    s.src = `https://api.deezer.com/search?q=${encodeURIComponent(q)}&output=jsonp&callback=displayResults`;
    document.body.appendChild(s);
};

window.displayResults = (r) => {
    const g = byId('music-grid'); g.innerHTML = '';
    r.data.forEach(t => {
        const c = document.createElement('div'); c.className = 'card';
        c.innerHTML = `<img src="${t.album.cover_medium}"><h4>${t.title}</h4><p>${t.artist.name}</p>`;
        c.onclick = () => {
            byId('current-img').src = t.album.cover_medium; byId('current-img').style.display = 'block';
            byId('current-title').textContent = t.title;
            const a = new Audio(t.preview); a.play();
        };
        g.appendChild(c);
    });
};
</script>
</head>
<body>

<div id="scrReg" class="screen">
    <div style="background:#111; padding:30px; border-radius:25px; width:85%; text-align:center">
        <h2 style="color:#00f2ff; margin-bottom: 15px;">Bem-vindo ✨</h2>
        <form id="formReg">
            <input id="n" placeholder="Seu nome" required>
            <input type="date" id="regData" required>
            <select id="regGen"><option>Masculino</option><option>Feminino</option></select>
            <textarea id="regBio" placeholder="Sua bio"></textarea>
            <button class="save-btn">ENTRAR NO SISTEMA</button>
        </form>
    </div>
</div>

<div id="app-switcher">
    <button class="switch-btn active" onclick="switchApp('pageChat', this)">CONVERSAR 💬</button>
    <button class="switch-btn" onclick="switchApp('pageMusic', this)">OUVIR MÚSICA 🎵</button>
</div>

<div class="main-wrapper">
    <div id="pageChat" class="app-page active">
        <div id="btnFlutuante" class="menu-btn-float"><button onclick="abrirChat()">💬</button></div>
        <div id="side" class="panel"><div id="sideContent" style="height:100%; display:flex; flex-direction:column;"></div></div>
        
        <div id="painelPerfil" class="screen">
            <div style="background:#111; padding:25px; border-radius:25px; width:85%; border:1px solid #00f2ff; position: relative;">
                <button style="position: absolute; top: 15px; right: 20px; background:none; border:none; color:#fff; font-size: 22px;" onclick="fecharMeuPerfil()">✕</button>
                <div class="avatar-grande" id="meuAvatarPerfil">👤</div>
                <div class="stats-container">
                    <div class="stat-item"><span id="meusSeguidores" class="stat-val">0</span><span class="stat-label">Seguidores</span></div>
                    <div class="stat-item"><span id="meusSeguindo" class="stat-val">0</span><span class="stat-label">Seguindo</span></div>
                </div>
                <input id="editNome" placeholder="Nome">
                <textarea id="editBio" placeholder="Bio"></textarea>
                <button class="save-btn" onclick="salvarPerfil()">SALVAR</button>
            </div>
        </div>

        <div id="painelExterno" class="screen">
            <div style="background:#111; padding:25px; border-radius:25px; width:85%; position: relative; border: 1px solid #222;">
                <button style="position: absolute; top: 15px; right: 20px; background:none; border:none; color:#fff; font-size: 22px;" onclick="fecharPerfilExterno()">✕</button>
                <div id="perfilExternoContent"></div>
            </div>
        </div>

        <div id="telaCall" class="call-overlay">
            <div class="call-grid" id="callGrid"></div>
            <div class="controles-call"><button class="icon-btn btn-hangup" onclick="sairChamada()">📞</button></div>
        </div>
    </div>

    <div id="pageMusic" class="app-page">
        <header class="music-header">
            <div class="search-bar-music">
                <input type="text" id="music-input" placeholder="O que vamos ouvir?" onkeypress="if(event.key === 'Enter') performSearch()">
                <button style="background:none;border:none;font-size:20px" onclick="performSearch()">🔍</button>
            </div>
        </header>
        <main id="music-grid"></main>
        <footer class="music-footer">
            <div style="display:flex; align-items:center; gap:15px;">
                <img id="current-img" src="" style="width:55px; height:55px; border-radius:8px; display:none;">
                <h4 id="current-title" style="font-size:14px;">Nenhuma tocando</h4>
            </div>
        </footer>
    </div>
</div>

</body>
</html>
